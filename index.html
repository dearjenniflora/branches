<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="枝间 BRANCHES — 看见你的需求，多小都值得被看见。"
  />
  <title>枝间 · BRANCHES</title>

  <style>
    /* =========================================================
       01. DESIGN TOKENS
       Minimal from afar.
       Intricate up close.
       Tactile when touched.
    ========================================================= */

    :root {
      --paper: #f6f0e5;
      --paper-soft: #fbf7ee;
      --paper-warm: #eee4d1;

      --ink: #34302c;
      --ink-soft: #696158;
      --ink-faint: #8d8479;

      --sage: #a9b7a1;
      --sage-soft: #dbe2d4;
      --blue: #aabec7;
      --blue-soft: #dbe4e6;
      --rose: #ceb0aa;
      --rose-soft: #ead9d4;
      --butter: #eadcaf;
      --pearl: #f6f1df;

      --line: rgba(70, 62, 52, 0.12);
      --line-strong: rgba(70, 62, 52, 0.2);

      --shadow-soft:
        0 14px 28px rgba(102, 87, 63, 0.08),
        0 4px 8px rgba(102, 87, 63, 0.07);

      --shadow-button:
        0 9px 15px rgba(114, 96, 65, 0.13),
        0 2px 4px rgba(89, 76, 55, 0.1),
        inset 0 1.5px 0 rgba(255,255,255,.88);

      --shadow-button-hover:
        0 13px 22px rgba(114, 96, 65, 0.14),
        0 4px 7px rgba(89, 76, 55, 0.1),
        inset 0 2px 0 rgba(255,255,255,.95);

      --shadow-inset:
        inset 0 3px 8px rgba(107, 91, 67, 0.11),
        inset 0 -1px 1px rgba(255,255,255,.8);

      --radius-s: 12px;
      --radius-m: 18px;
      --radius-l: 26px;
      --radius-xl: 34px;

      --ease: cubic-bezier(.22,.8,.32,1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(234,220,175,.42), transparent 30%),
        radial-gradient(circle at 85% 18%, rgba(170,190,199,.28), transparent 31%),
        radial-gradient(circle at 75% 82%, rgba(206,176,170,.25), transparent 32%),
        radial-gradient(circle at 22% 75%, rgba(169,183,161,.27), transparent 33%),
        linear-gradient(145deg, #f7f1e6 0%, #f2eadb 45%, #f8f2e8 100%);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
      overflow-x: hidden;
    }

    /* Canvas grain.
       Nearly invisible from afar,
       discoverable up close. */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      z-index: 1000;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");

      mix-blend-mode: multiply;
    }

    body::after {
      content: "";
      position: fixed;
      width: 42vw;
      height: 42vw;
      left: -15vw;
      top: 34vh;
      background:
        radial-gradient(circle, rgba(255,248,215,.34), transparent 68%);
      pointer-events: none;
      filter: blur(34px);
      z-index: -1;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       02. TYPOGRAPHY
    ========================================================= */

    .editorial {
      font-family:
        "Iowan Old Style",
        "Songti SC",
        "STSong",
        Georgia,
        serif;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .17em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 14px;
    }

    .small-en {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      line-height: 1.4;
      letter-spacing: .055em;
      color: var(--ink-faint);
      font-weight: 450;
    }

    .muted {
      color: var(--ink-soft);
    }

    /* =========================================================
       03. APP SHELL
    ========================================================= */

    #app {
      min-height: 100vh;
    }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;

      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);

      background:
        linear-gradient(
          to bottom,
          rgba(248,243,233,.90),
          rgba(248,243,233,.64)
        );

      border-bottom: 1px solid rgba(77,67,55,.07);
    }

    .nav-inner {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .brand-cn {
      font-family:
        "Iowan Old Style",
        "Songti SC",
        serif;
      font-size: 20px;
      letter-spacing: .08em;
    }

    .brand-en {
      display: block;
      margin-top: 1px;
      font-size: 8px;
      letter-spacing: .21em;
      color: var(--ink-faint);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 9px 13px;
      border-radius: 12px;
      color: var(--ink-soft);
      font-size: 13px;
      transition: .2s var(--ease);
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--ink);
      background: rgba(255,255,255,.27);
    }

    main {
      min-height: calc(100vh - 76px);
    }

    /* =========================================================
       04. TACTILE PHYSICS
    ========================================================= */

    .tactile {
      position: relative;
      isolation: isolate;

      border: 1px solid rgba(103,90,69,.11);
      border-radius: 15px;

      background:
        radial-gradient(
          circle at 28% 14%,
          rgba(255,255,255,.95),
          transparent 42%
        ),
        linear-gradient(
          145deg,
          #fbf6e9,
          #efe5cf
        );

      box-shadow: var(--shadow-button);

      transform: translateY(0);
      cursor: pointer;

      transition:
        transform .13s var(--ease),
        box-shadow .16s var(--ease),
        filter .16s var(--ease);
    }

    .tactile:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-button-hover);
      filter: brightness(1.012);
    }

    .tactile:active,
    .tactile.is-pressed {
      transform: translateY(2px);

      box-shadow:
        0 1px 2px rgba(96,82,59,.08),
        inset 0 3px 6px rgba(101,85,62,.14),
        inset 0 -1px 2px rgba(255,255,255,.64);

      filter: brightness(.99);
    }

    .tactile::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;

      background:
        linear-gradient(
          160deg,
          rgba(255,255,255,.32),
          transparent 35%
        );

      opacity: .72;
      mix-blend-mode: screen;
      z-index: -1;
    }

    .release-glow::after {
      content: "";
      position: absolute;
      inset: -9px;
      border-radius: inherit;
      z-index: -2;
      pointer-events: none;

      border: 1px solid rgba(239,214,153,.38);

      animation: releaseGlow .48s ease-out forwards;
    }

    @keyframes releaseGlow {
      0% {
        opacity: .7;
        transform: scale(.96);
      }

      100% {
        opacity: 0;
        transform: scale(1.08);
      }
    }

    .btn {
      min-height: 48px;
      padding: 12px 19px;
      border-radius: 15px;
      font-weight: 620;
      letter-spacing: .01em;
    }

    .btn-primary {
      min-height: 52px;
      padding-inline: 22px;
    }

    .btn-secondary {
      min-height: 42px;
      padding: 9px 14px;
      font-size: 13px;

      box-shadow:
        0 5px 10px rgba(99,86,64,.08),
        0 1px 2px rgba(99,86,64,.08),
        inset 0 1px 0 rgba(255,255,255,.78);
    }

    .text-action {
      border: 0;
      background: none;
      padding: 0;

      color: var(--ink-soft);
      cursor: pointer;

      text-decoration-line: underline;
      text-decoration-color: rgba(69,61,53,.25);
      text-underline-offset: 5px;

      transition:
        color .18s ease,
        transform .18s ease;
    }

    .text-action:hover {
      color: var(--ink);
      transform: translateX(2px);
    }

    /* Input receives */

    .inset-field {
      width: 100%;
      border: 1px solid rgba(97,81,62,.09);
      outline: none;

      background:
        linear-gradient(
          145deg,
          rgba(238,229,211,.65),
          rgba(250,246,237,.74)
        );

      box-shadow: var(--shadow-inset);

      transition:
        box-shadow .2s ease,
        background .2s ease;
    }

    .inset-field:focus {
      background:
        linear-gradient(
          145deg,
          rgba(251,247,235,.9),
          rgba(241,233,214,.62)
        );

      box-shadow:
        inset 0 2px 6px rgba(103,87,64,.08),
        inset 0 0 24px rgba(255,250,228,.56),
        0 0 0 3px rgba(230,213,167,.13);
    }

    /* =========================================================
       05. HOME
    ========================================================= */

    .home {
      position: relative;
      min-height: calc(100vh - 76px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 72px 0 84px;
    }

    .home-inner {
      position: relative;
      width: min(820px, 100%);
      text-align: center;
      z-index: 5;
    }

    .home-mark {
      margin-bottom: 25px;
      color: var(--ink-faint);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .hero-title {
      max-width: 720px;
      margin: 0 auto 18px;

      font-family:
        "Iowan Old Style",
        "Songti SC",
        "STSong",
        Georgia,
        serif;

      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.08;
      letter-spacing: -.035em;
      font-weight: 500;
    }

    .hero-description {
      max-width: 550px;
      margin: 0 auto 35px;

      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.85;
    }

    .need-box {
      position: relative;
      width: min(690px, 100%);
      margin: auto;

      border-radius: 27px;
      padding: 8px;

      background:
        linear-gradient(
          135deg,
          rgba(239,230,211,.62),
          rgba(252,248,239,.72)
        );

      box-shadow:
        inset 0 4px 13px rgba(95,79,57,.11),
        inset 0 -2px 3px rgba(255,255,255,.85),
        0 20px 48px rgba(110,91,62,.055);
    }

    .need-input {
      display: block;
      width: 100%;
      min-height: 132px;

      border: 0;
      outline: 0;

      resize: none;

      padding:
        24px
        24px
        66px;

      border-radius: 21px;

      background:
        rgba(248,244,235,.42);

      color: var(--ink);
      line-height: 1.7;
      font-size: 16px;
    }

    .need-input::placeholder {
      color: rgba(70,62,54,.38);
    }

    .need-submit {
      position: absolute;
      right: 17px;
      bottom: 17px;
    }

    .need-submit .small-en {
      display: inline;
      margin-left: 6px;
    }

    .floating-needs {
      width: min(850px, 100%);
      margin: 27px auto 0;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 12px;
    }

    .need-chip {
      border: 1px solid rgba(79,69,58,.09);
      background: rgba(251,247,238,.45);
      color: var(--ink-soft);

      padding: 9px 12px;
      border-radius: 999px;

      cursor: pointer;
      font-size: 12px;

      backdrop-filter: blur(8px);

      transition:
        transform .3s var(--ease),
        background .3s ease,
        box-shadow .3s ease;
    }

    .need-chip:hover {
      transform: translateY(-2px);
      background: rgba(255,251,242,.67);
      box-shadow: 0 8px 18px rgba(100,84,61,.06);
    }

    .need-chip:nth-child(2n) {
      animation: driftA 8s ease-in-out infinite alternate;
    }

    .need-chip:nth-child(2n+1) {
      animation: driftB 10s ease-in-out infinite alternate;
    }

    @keyframes driftA {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    @keyframes driftB {
      from { transform: translateY(1px); }
      to { transform: translateY(-2px); }
    }

    .home-footnote {
      margin-top: 23px;
      font-size: 11px;
      color: var(--ink-faint);
    }

    /* =========================================================
       06. PAGE
    ========================================================= */

    .page {
      padding: 72px 0 100px;
      animation: pageIn .36s ease both;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;

      margin-bottom: 48px;
    }

    .page-head h1 {
      margin-bottom: 9px;
      font-size: clamp(36px, 5vw, 57px);
      line-height: 1.04;
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .page-head p {
      max-width: 560px;
      margin-bottom: 0;
      color: var(--ink-soft);
      line-height: 1.8;
      font-size: 14px;
    }

    /* =========================================================
       07. BRANCH CONSTELLATION / GALLERY
    ========================================================= */

    .branch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .branch-node {
      position: relative;
      min-height: 235px;
      overflow: hidden;

      padding: 25px;

      border: 1px solid rgba(76,66,54,.08);
      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(251,247,239,.48),
          rgba(243,235,220,.35)
        );

      cursor: pointer;

      transition:
        transform .32s var(--ease),
        box-shadow .32s var(--ease),
        background .32s ease;
    }

    .branch-node::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      right: -40px;
      bottom: -50px;
      border-radius: 50%;

      background: var(--wash, rgba(234,220,175,.27));
      filter: blur(24px);
      opacity: .6;
    }

    .branch-node:hover {
      transform: translateY(-5px);

      box-shadow:
        0 18px 35px rgba(105,88,61,.07),
        inset 0 1px 0 rgba(255,255,255,.54);

      background:
        linear-gradient(
          145deg,
          rgba(255,251,243,.64),
          rgba(243,235,220,.38)
        );
    }

    .branch-node:active {
      transform: translateY(-1px);

      box-shadow:
        0 5px 12px rgba(105,88,61,.05),
        inset 0 2px 5px rgba(99,83,60,.07);
    }

    .branch-kind {
      display: inline-flex;
      margin-bottom: 30px;
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .branch-name {
      position: relative;
      z-index: 2;

      max-width: 300px;

      font-family:
        "Iowan Old Style",
        "Songti SC",
        Georgia,
        serif;

      font-size: 25px;
      line-height: 1.14;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .branch-problem {
      position: relative;
      z-index: 2;

      margin: 0;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .branch-arrow {
      position: absolute;
      right: 22px;
      top: 22px;

      font-size: 18px;
      color: var(--ink-faint);

      transition: transform .3s var(--ease);
    }

    .branch-node:hover .branch-arrow {
      transform: translate(3px,-2px);
    }

    /* =========================================================
       08. MATCHING
    ========================================================= */

    .matching {
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      padding: 50px 0;
    }

    .matching-card {
      width: min(620px, 100%);
      margin-inline: auto;
      text-align: center;
    }

    .matching-orbit {
      width: 120px;
      height: 120px;
      margin: 0 auto 28px;
      position: relative;
    }

    .matching-orbit::before,
    .matching-orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .matching-orbit::before {
      inset: 25px;
      background: rgba(233,218,171,.5);
      box-shadow:
        0 0 40px rgba(233,218,171,.35);
    }

    .matching-orbit::after {
      inset: 6px;
      border: 1px solid rgba(88,77,61,.12);
      animation: quietRotate 2.6s linear infinite;
      border-top-color: rgba(88,77,61,.44);
    }

    @keyframes quietRotate {
      to { transform: rotate(360deg); }
    }

    /* =========================================================
       09. BRANCH DETAIL
    ========================================================= */

    .detail-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 56px;
      align-items: start;
    }

    .back {
      margin-bottom: 35px;
    }

    .detail-kind {
      margin-bottom: 18px;
    }

    .detail-title {
      max-width: 690px;
      margin-bottom: 20px;

      font-family:
        "Iowan Old Style",
        "Songti SC",
        Georgia,
        serif;

      font-size: clamp(42px, 6vw, 70px);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 500;
    }

    .detail-problem {
      max-width: 620px;
      margin-bottom: 37px;

      font-size: 17px;
      color: var(--ink-soft);
      line-height: 1.85;
    }

    .source-note {
      display: inline-flex;
      gap: 8px;
      align-items: center;

      padding: 8px 10px;
      margin-bottom: 34px;

      border-bottom: 1px solid rgba(78,67,55,.12);

      font-size: 11px;
      color: var(--ink-faint);
    }

    .use-panel {
      position: sticky;
      top: 105px;

      padding: 25px;
      border-radius: 25px;

      border: 1px solid rgba(78,67,55,.08);

      background:
        linear-gradient(
          145deg,
          rgba(247,241,228,.59),
          rgba(253,249,240,.5)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.47),
        0 18px 44px rgba(102,86,62,.05);
    }

    .panel-label {
      margin-bottom: 18px;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .field {
      width: 100%;
      min-height: 44px;
      padding: 11px 13px;
      border-radius: 12px;
      color: var(--ink);
    }

    textarea.field {
      min-height: 92px;
      resize: vertical;
      line-height: 1.6;
    }

    .use-actions {
      display: grid;
      gap: 10px;
      margin-top: 23px;
    }

    .use-actions .btn {
      width: 100%;
    }

    .detail-section {
      border-top: 1px solid var(--line);
      padding-top: 29px;
      margin-top: 38px;
    }

    .detail-section h3 {
      margin-bottom: 13px;
      font-size: 15px;
      font-weight: 650;
    }

    .detail-section p {
      color: var(--ink-soft);
      line-height: 1.8;
      font-size: 13px;
    }

    .mock-output {
      margin-top: 20px;

      padding: 25px;

      border-radius: 18px;

      border: 1px solid rgba(79,68,55,.09);

      background:
        linear-gradient(
          145deg,
          rgba(252,249,241,.65),
          rgba(241,233,218,.45)
        );

      animation: outputIn .4s var(--ease);
    }

    @keyframes outputIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .output-title {
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .output-body {
      color: var(--ink);
      line-height: 1.8;
      font-size: 14px;
    }

    .output-body ul {
      padding-left: 19px;
    }

    .output-body li {
      margin-bottom: 8px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(81,70,57,.11);
    }

    .check-row input {
      accent-color: #8f9c83;
    }

    .adaptation {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    /* =========================================================
       10. GROW
    ========================================================= */

    .grow {
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      padding: 70px 0;
    }

    .grow-card {
      width: min(620px, 100%);
      margin-inline: auto;
      text-align: center;
    }

    .seed {
      width: 64px;
      height: 64px;
      margin: 0 auto 27px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 37% 28%,
          #fff9e8,
          #e6d9ae 58%,
          #caba8c
        );

      box-shadow:
        0 12px 28px rgba(115,96,62,.15),
        inset 0 2px 2px rgba(255,255,255,.7);
    }

    .grow-title {
      margin-bottom: 13px;
      font-family:
        "Iowan Old Style",
        "Songti SC",
        serif;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .grow-copy {
      max-width: 520px;
      margin: 0 auto 28px;
      color: var(--ink-soft);
      line-height: 1.8;
      font-size: 14px;
    }

    .grow-need {
      margin: 0 auto 28px;
      padding: 18px 20px;
      max-width: 520px;

      border-radius: 16px;

      background: rgba(248,243,233,.52);
      border: 1px solid rgba(80,69,55,.08);

      color: var(--ink);
      font-family:
        "Iowan Old Style",
        "Songti SC",
        serif;
      font-size: 18px;
    }

    /* =========================================================
       11. MINE
    ========================================================= */

    .mine-grid {
      display: grid;
      grid-template-columns: 190px minmax(0,1fr);
      gap: 40px;
      align-items: start;
    }

    .mine-tabs {
      position: sticky;
      top: 105px;

      display: grid;
      gap: 5px;
    }

    .mine-tab {
      text-align: left;
      border: 0;
      background: transparent;

      padding: 11px 12px;

      border-radius: 11px;

      cursor: pointer;
      color: var(--ink-soft);

      transition: .2s ease;
    }

    .mine-tab:hover,
    .mine-tab.active {
      color: var(--ink);
      background: rgba(255,255,255,.32);
    }

    .mine-content {
      min-width: 0;
    }

    .saved-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }

    .saved-item {
      padding: 20px;
      border-radius: 17px;

      border: 1px solid rgba(78,67,54,.08);

      background: rgba(250,246,237,.4);
    }

    .saved-item h3 {
      margin-bottom: 9px;
      font-size: 17px;
    }

    .saved-item p {
      margin-bottom: 14px;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.6;
    }

    .empty-state {
      padding: 55px 20px;
      text-align: center;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      color: var(--ink-soft);
    }

    .record {
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }

    .record-time {
      margin-top: 7px;
      font-size: 10px;
      color: var(--ink-faint);
    }

    .settings-card {
      max-width: 640px;
      padding: 25px 0;
      border-top: 1px solid var(--line);
    }

    .settings-note {
      margin-top: 16px;
      color: var(--ink-faint);
      font-size: 11px;
      line-height: 1.7;
    }

    /* =========================================================
       12. TOAST
    ========================================================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 27px;
      z-index: 10000;

      transform: translate(-50%, 20px);

      padding: 12px 17px;
      border-radius: 15px;

      color: var(--ink);

      background:
        linear-gradient(
          145deg,
          rgba(253,249,238,.96),
          rgba(238,227,205,.95)
        );

      border: 1px solid rgba(77,65,51,.09);

      box-shadow:
        0 14px 32px rgba(89,74,52,.13),
        inset 0 1px rgba(255,255,255,.8);

      opacity: 0;
      pointer-events: none;

      transition:
        opacity .25s ease,
        transform .25s var(--ease);

      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       13. QUESTION BOX
    ========================================================= */

    .question-box {
      max-width: 760px;
      margin: 0 auto;
      padding: 82px 0;
    }

    .question-box-head {
      padding-bottom: 30px;
      border-bottom: 1px solid var(--line);
    }

    .question-box-title {
      margin: 12px 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(42px, 7vw, 70px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.05em;
    }

    .question-box-copy {
      max-width: 520px;
      color: var(--ink-soft);
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .question-form,
    .question-list,
    .admin-list {
      margin-top: 34px;
    }

    .question-card {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }

    .question-card p {
      margin: 0;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .question-answer {
      margin-top: 14px !important;
      padding: 14px 16px;
      border-left: 2px solid var(--sage);
      color: var(--ink-soft);
      background: rgba(219,226,212,.28);
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 25px 0 8px;
    }

    .admin-answer-field {
      min-height: 88px;
      margin-top: 15px;
    }

    .box-status {
      display: inline-block;
      margin-top: 18px;
      color: var(--ink-faint);
      font-size: 12px;
    }

    /* =========================================================
       14. MOBILE
    ========================================================= */

    @media (max-width: 880px) {
      .branch-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .detail-wrap {
        grid-template-columns: 1fr;
      }

      .use-panel {
        position: static;
      }

      .mine-grid {
        grid-template-columns: 1fr;
      }

      .mine-tabs {
        position: static;
        display: flex;
        overflow-x: auto;
        padding-bottom: 7px;
      }

      .mine-tab {
        white-space: nowrap;
      }
    }

    @media (max-width: 620px) {
      .navbar {
        height: 68px;
      }

      .nav-inner {
        width: min(100% - 24px, 1180px);
      }

      .brand-cn {
        font-size: 17px;
      }

      .nav-link {
        padding: 8px 7px;
        font-size: 11px;
      }

      .nav-link .desktop-en {
        display: none;
      }

      .shell {
        width: calc(100% - 28px);
      }

      .home {
        min-height: calc(100vh - 68px);
        padding: 52px 0 72px;
      }

      .hero-title {
        font-size: 43px;
      }

      .hero-description {
        font-size: 14px;
      }

      .need-input {
        min-height: 155px;
        font-size: 15px;
      }

      .need-submit {
        left: 16px;
        right: 16px;
      }

      .need-submit .btn {
        width: 100%;
      }

      .branch-grid {
        grid-template-columns: 1fr;
      }

      .branch-node {
        min-height: 205px;
      }

      .page {
        padding-top: 45px;
      }

      .page-head {
        display: block;
      }

      .detail-title {
        font-size: 45px;
      }

      .saved-grid {
        grid-template-columns: 1fr;
      }

      .floating-needs {
        justify-content: flex-start;
      }
    }

    /* Editorial refresh: quiet surfaces, clear hierarchy, one primary action. */
    :root {
      --paper: #fff2f6;
      --paper-soft: #fffbfc;
      --paper-warm: #fbe4ec;
      --ink: #382f36;
      --ink-soft: #655960;
      --ink-faint: #8b7880;
      --rose: #d9a3b6;
      --rose-soft: #f7dfe8;
      --sage: #8aa68b;
      --sage-soft: #e3eee2;
      --blue: #a9cde2;
      --blue-soft: #e5f3fa;
      --line: rgba(143, 99, 117, .16);
    }

    body {
      background: radial-gradient(circle at 86% 12%, rgba(237, 208, 222, .28), transparent 32%), var(--paper);
    }

    body::before,
    body::after {
      display: none;
    }

    .navbar {
      height: 72px;
      background: rgba(255, 247, 250, .95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: none;
    }

    .brand-cn {
      font-size: 22px;
      font-weight: 600;
    }

    .brand-en {
      font-size: 9px;
      letter-spacing: .16em;
    }

    .nav-link {
      border-radius: 0;
      padding: 10px 13px;
      font-size: 14px;
    }

    .nav-link.active,
    .nav-link:hover {
      background: transparent;
      box-shadow: inset 0 -2px #be819b;
    }

    .home {
      min-height: calc(100vh - 72px);
      padding: 74px 0 90px;
    }

    .home-inner {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: clamp(38px, 7vw, 116px);
      text-align: left;
    }

    .home-mark {
      margin: 0 0 24px;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 550;
      letter-spacing: .14em;
    }

    .hero-title {
      max-width: none;
      margin: 0 0 28px;
      font-size: clamp(54px, 6.7vw, 94px);
      line-height: 1.13;
      letter-spacing: -.065em;
    }

    .hero-description {
      max-width: 380px;
      margin: 0 0 43px;
      font-size: 17px;
      line-height: 1.8;
    }

    .home-discover {
      display: inline-flex;
      align-items: center;
      gap: 17px;
      padding: 0 0 7px;
      border: 0;
      border-bottom: 1px solid var(--ink);
      background: transparent;
      cursor: pointer;
      font-size: 15px;
    }

    .home-discover:hover span {
      transform: translate(3px, -3px);
    }

    .home-discover span {
      transition: transform .2s ease;
    }

    .home-action {
      width: 100%;
    }

    .need-box {
      width: 100%;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper-soft);
      box-shadow: none;
    }

    .need-label {
      display: block;
      padding: 25px 26px 0;
      font-size: 15px;
      font-weight: 600;
    }

    .need-input {
      min-height: 205px;
      padding: 16px 26px 92px;
      border-radius: 0;
      background: transparent;
      font-size: 16px;
      resize: vertical;
    }

    .need-input::placeholder {
      color: #777d72;
    }

    .need-submit {
      right: 20px;
      bottom: 20px;
    }

    .tactile,
    .btn,
    .btn-secondary {
      border-radius: 12px;
      box-shadow: none;
      background: transparent;
    }

    .tactile::before,
    .release-glow::after {
      display: none;
    }

    .btn-primary {
      border: 1px solid #8d5c71;
      background: #8d5c71;
      color: var(--paper-soft);
    }

    .btn-secondary {
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .tactile:hover,
    .tactile:active,
    .tactile.is-pressed {
      transform: none;
      box-shadow: none;
      filter: none;
    }

    .btn-primary:hover {
      background: #75495d;
    }

    .btn-secondary:hover {
      border-color: var(--ink);
    }

    .floating-needs {
      width: 100%;
      margin: 16px 0 0;
      justify-content: flex-start;
      gap: 6px;
    }

    .need-chip,
    .need-chip:nth-child(n) {
      padding: 8px 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--ink-soft);
      font-size: 12px;
      animation: none;
      backdrop-filter: none;
    }

    .need-chip:hover {
      transform: none;
      background: #f9e3eb;
      box-shadow: none;
    }

    .page-head {
      margin-bottom: 42px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--line);
    }

    .page-head h1 {
      margin-bottom: 0;
      font-size: clamp(42px, 5vw, 68px);
    }

    .branch-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .branch-node {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      width: 100%;
      min-height: 224px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper-soft);
      text-align: left;
    }

    .branch-node::after {
      width: 138px;
      height: 138px;
      right: -45px;
      bottom: -55px;
      opacity: .27;
      filter: blur(36px);
    }

    .branch-node:hover,
    .branch-node:active {
      transform: none;
      background: #ffffff;
      box-shadow: none;
      border-color: #d9adbd;
    }

    .branch-node:nth-child(3n + 2) {
      background: #f8fcf8;
    }

    .branch-node:nth-child(3n) {
      background: #f7fbfd;
    }

    .branch-name {
      max-width: 410px;
      margin: 0;
      font-size: clamp(28px, 3vw, 38px);
      line-height: 1.22;
    }

    .branch-arrow {
      top: 26px;
      right: 27px;
      color: var(--ink);
      font-size: 23px;
    }

    .branch-demo {
      position: absolute;
      top: 29px;
      left: 28px;
      font-size: 12px;
      color: var(--ink-soft);
    }

    .detail-wrap {
      grid-template-columns: minmax(0, 1fr) minmax(320px, 430px);
      gap: clamp(38px, 7vw, 100px);
    }

    .detail-title {
      font-size: clamp(45px, 5.5vw, 76px);
      line-height: 1.12;
      text-wrap: balance;
    }

    .detail-problem {
      max-width: 540px;
      margin-bottom: 26px;
      font-size: 16px;
    }

    .detail-demo {
      margin-bottom: 28px;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .use-panel {
      top: 96px;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper-soft);
      box-shadow: none;
    }

    .inset-field {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fffdfd;
      box-shadow: none;
    }

    .inset-field:focus {
      border-color: #b78199;
      background: #fffdfd;
      box-shadow: 0 0 0 3px rgba(183,129,153,.14);
    }

    .field-label {
      margin-bottom: 9px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 550;
    }

    .question-box-title {
      line-height: 1.13;
    }

    :is(button, textarea, input, select, a):not(.need-input):focus-visible {
      outline: 2px solid #9b7285;
      outline-offset: 3px;
    }

    @media (max-width: 880px) {
      .home-inner {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .home {
        min-height: auto;
      }

      .detail-wrap {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .home {
        padding: 62px 0 74px;
      }

      .hero-title {
        font-size: clamp(52px, 12vw, 68px);
      }

      .home-inner {
        gap: 38px;
      }

      .need-input {
        min-height: 182px;
      }

      .branch-grid {
        grid-template-columns: 1fr;
      }

      .branch-node {
        min-height: 184px;
      }

      .use-panel {
        padding: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* Monet gallery: the paintings carry the scene; quiet panels carry the work. */
    :root {
      --paper: #f8eaf0;
      --paper-soft: #fff9fa;
      --paper-warm: #f4dde7;
      --ink: #292d2c;
      --ink-soft: #4d5653;
      --ink-faint: #66716d;
      --line: rgba(86, 91, 80, .18);
      --shadow-soft: 0 20px 60px rgba(33, 43, 40, .13);
    }

    body {
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(255, 246, 249, .84), rgba(255, 246, 249, .88)),
        var(--page-art);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body[data-view="home"] {
      background-image:
        linear-gradient(90deg, rgba(255, 241, 246, .30), rgba(255, 241, 246, .10)),
        var(--page-art);
      background-position: center 48%;
    }

    body[data-view="mine"] {
      background-image:
        linear-gradient(rgba(252, 240, 246, .30), rgba(252, 240, 246, .58)),
        var(--page-art);
      background-position: center 34%;
    }

    body[data-view="branches"] {
      background-image:
        linear-gradient(rgba(255, 247, 249, .86), rgba(255, 247, 249, .92)),
        var(--page-art);
    }

    .navbar {
      background: rgba(255, 247, 249, .83);
      border-bottom-color: rgba(255, 255, 255, .54);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .nav-link.active,
    .nav-link:hover {
      box-shadow: inset 0 -2px #8b8f79;
    }

    .home .shell {
      width: min(1300px, calc(100% - 48px));
    }

    .home-inner {
      gap: clamp(26px, 6vw, 104px);
      align-items: stretch;
    }

    .home-intro,
    .home-action {

    .home-intro {

    }

    .home-action {
      padding: 14px;
    }

    .hero-title {
      margin-bottom: 22px;
      font-size: clamp(52px, 6.4vw, 90px);
    }

    .hero-description {
      margin-bottom: 30px;
    }

    .need-box {
      border-color: rgba(102, 100, 91, .15);

    .floating-needs {

    .need-chip,

    .btn-primary {

    }

    .btn-primary:hover {
      background: #394d43;
    }

    .page {
      min-height: calc(100vh - 72px);
    }

    .page-head {
      width: fit-content;
      max-width: 100%;
      margin-inline: auto;
      justify-content: center;
      text-align: center;
      padding: 20px 28px;
      border: 1px solid rgba(255, 255, 255, .64);

    .branch-grid {

    }

    .branch-node,

      background-image:
        linear-gradient(180deg, rgba(22, 32, 30, .04) 25%, rgba(22, 32, 30, .83) 100%),

    .branch-node:hover,
    .branch-node:active {

      text-shadow: 0 1px 8px rgba(0, 0, 0, .55);
    }

    .branch-demo {
      font-weight: 600;
    }

    .detail-wrap > div:first-child,
    .use-panel,
    .mine-grid,
    .matching-card,
    .grow-card,
    .question-box {
      border: 1px solid rgba(255, 255, 255, .65);
      border-radius: 26px;
      background: rgba(255, 249, 250, .91);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .detail-wrap > div:first-child,
    .mine-grid,
    .matching-card,
    .grow-card {
      padding: clamp(25px, 3vw, 42px);
    }

    .use-panel {
      background: rgba(255, 251, 251, .96);
    }

    .text-action.back {
      padding: 10px 15px;
      border-radius: 999px;
      background: rgba(255, 249, 250, .88);
    }

    .question-box {
      max-width: 830px;
      margin: 42px auto 72px;
      padding: clamp(26px, 5vw, 68px);
    }

    .toast {
      background: rgba(255, 251, 251, .97);
      color: var(--ink);
    }

    @media (max-width: 1000px) {
      .branch-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));

    function motionAvailable() {
      return !reducedMotion.matches && typeof document.startViewTransition === "function";
    }

    function focusMainHeading() {
      const heading = app.querySelector("main h1") || app.querySelector("main");
      if (!heading) return;
      heading.tabIndex = -1;
      heading.focus({ preventScroll: true });
    }

    function updateWithMotion(update, options = {}) {
      const sequence = ++viewUpdateSequence;
      activeViewTransition?.skipTransition();
      activeViewTransition = null;

      if (!motionAvailable()) {
        update();
        options.afterUpdate?.();
        if (options.focus) focusMainHeading();
        options.onFinish?.();
        return null;
      }

      document.documentElement.dataset.transition = options.kind || "page";
      const transition = document.startViewTransition(() => {
        if (sequence !== viewUpdateSequence) return;
        update();
        options.afterUpdate?.();
      });
      activeViewTransition = transition;

      transition.updateCallbackDone.then(() => {
        if (options.focus && activeViewTransition === transition) focusMainHeading();
      }).catch(() => {});

      transition.finished.finally(() => {
        options.onFinish?.();
        if (activeViewTransition === transition) {
          activeViewTransition = null;
          delete document.documentElement.dataset.transition;
        }
      }).catch(() => {});

      return transition;
    }

    }

    function write(key, value) {

      const existing = localStorage.getItem(key);

      if (/^[0-9a-f]{32}$/i.test(existing || "")) {
        return existing;
      }

      const id = crypto.randomUUID().replaceAll("-", "");
      localStorage.setItem(key, id);
      return id;
    }

    /* =========================================================
       MATCH
    ========================================================= */

    function matchNeed(text) {
      const normalized = text.toLowerCase();

      let best = null;
      let bestScore = 0;

      branches.forEach(branch => {
        let score = 0;

        branch.keywords.forEach(keyword => {
          if (normalized.includes(keyword.toLowerCase())) {
            score += keyword.length >= 3 ? 2 : 1;
          }
        });

        if (score > bestScore) {
          best = branch;
          bestScore = score;
        }
      });

      return bestScore >= 2 ? best : null;
    }

    function rememberNeed(text) {
      const memories = read(STORAGE.memories);

      memories.unshift({
        text,
        time: nowLabel()
      });

      write(
        STORAGE.memories,
        memories.slice(0, 30)
      );
    }

    async function submitNeed(event) {
      event.preventDefault();

      const input = document.querySelector("#needInput");
      const need = input.value.trim();

      if (!need) {
        showToast("先说说发生了什么。");
        input.focus();
        return;
      }

      state.lastNeed = need;
      state.matchUnavailable = false;
      rememberNeed(need);
      const requestId = ++matchSequence;

      state.view = "matching";
      updateWithMotion(() => {
        render();
        window.scrollTo(0, 0);
      }, { kind: "page", focus: true });

      try {
        const response = await fetch(AI_PROXY, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            action: "match",
            need
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();

        console.log("枝间 AI 匹配：", result);

        if (requestId !== matchSequence || state.view !== "matching") return;

        if (result.slug && getBranch(result.slug)) {
          go("branch", result.slug);
        } else {
          go("grow");
        }

      } catch (error) {
        console.error("AI matcher failed:", error);
        state.matchUnavailable = true;

        /*
          AI 暂时挂掉时，不让产品直接死掉。
          自动降级为本地 matcher。
        */

        const fallback = matchNeed(need);

        if (requestId !== matchSequence || state.view !== "matching") return;

        if (fallback) {
          showToast("匹配服务暂时繁忙，已按关键词查找。");

          go("branch", fallback.slug);

        } else {
          go("grow");
        }
      }
    }

    let branchRunController = null;

    async function runBranch(event, slug) {
      event.preventDefault();
      branchRunController?.abort();
      branchRunController = new AbortController();
      const requestId = ++branchRunSequence;

      const form = event.currentTarget;
      const values = Object.fromEntries(new FormData(form).entries());

      const output = document.querySelector("#mockOutput");

      output.classList.remove("hidden");

      output.innerHTML = `
        <div class="mock-output">

          <div class="output-title">
            BRANCH IS THINKING
          </div>

          <div class="output-body">
            正在根据你的情况生长出这一次的结果……
          </div>

        </div>
      `;

      output.scrollIntoView({
        behavior: reducedMotion.matches ? "auto" : "smooth",
        block: "start"
      });

      try {
        const response = await fetch(AI_PROXY, {
          method: "POST",
          signal: branchRunController.signal,

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            action: "run",
            slug,
            inputs: values
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        if (requestId !== branchRunSequence || !output.isConnected ||
            state.view !== "branch" || state.currentSlug !== slug) return;

        output.innerHTML = `
          <div class="mock-output">

            <div class="output-title">
              BRANCH RESULT
            </div>

            <div
              class="output-body"
              style="white-space:pre-wrap"
            >${escapeHTML(data.result)}</div>

          </div>
        `;

      } catch (error) {
        if (error.name === "AbortError" || requestId !== branchRunSequence ||
            !output.isConnected || state.view !== "branch" || state.currentSlug !== slug) return;
        console.error("Branch AI failed:", error);

        /*
          网络 / API 挂了以后，Demo 依旧能跑。
        */

        output.innerHTML = `
          <div class="mock-output">

            <div class="output-title">
              LOCAL FALLBACK
            </div>

            <div class="output-body">
              ${mockResult(slug, values)}
            </div>

          </div>
        `;

        showToast("AI 暂时没有回应，已展示本地 Demo。");
      }
    }

    function replaceQuestionBoxMarkup(root, markup) {
      const oldCards = [...root.querySelectorAll("[data-motion-key]")];
      if (!oldCards.length || !motionAvailable()) {
        root.innerHTML = markup;
        return;
      }

      const named = [];
      const marker = Symbol("list-transition");
      const nameCards = cards => cards.forEach(card => {
        const key = card.dataset.motionKey.replace(/[^a-zA-Z0-9_-]/g, "-");
        card._viewMotionMarker = marker;
        card.style.viewTransitionName = `card-${key}`;
        named.push(card);
      });
      nameCards(oldCards);
      updateWithMotion(() => {
        root.innerHTML = markup;
        nameCards(root.querySelectorAll("[data-motion-key]"));
      }, {
        kind: "list",
        onFinish: () => named.forEach(card => {
          if (card._viewMotionMarker !== marker) return;
          card.style.removeProperty("view-transition-name");
          delete card._viewMotionMarker;
        })
      });
    }

    let publicBoxLoadSequence = 0;
    let managementLoadSequence = 0;

    async function loadQuestionBox() {
      const root = document.querySelector("#questionBoxContent");
      if (!root || !state.boxId) return;
      const boxId = state.boxId;
      const requestId = ++publicBoxLoadSequence;

      try {
        const data = await questionBoxRequest("get", { boxId });
        if (requestId !== publicBoxLoadSequence || !root.isConnected ||
            state.boxId !== boxId || state.view !== "question-box") return;
        replaceQuestionBoxMarkup(root, `
          <header class="question-box-head">
            <h1 class="question-box-title">${escapeHTML(data.box.title)}</h1>
            ${data.box.greeting ? `<p class="question-box-copy">${escapeHTML(data.box.greeting)}</p>` : ""}

            ${data.questions.length ? data.questions.map(question => `
              <article class="question-card" data-motion-key="question-${question.id}">

    /* =========================================================
       ADAPTATION
    ========================================================= */

    let adaptationToggleToken = 0;

    function toggleAdaptation() {
      const box = document.querySelector("#adaptationBox");
      if (!box) return;
      const opening = box.classList.contains("hidden") || box.dataset.closing === "true";
      const token = ++adaptationToggleToken;

      if (reducedMotion.matches) {
        box.classList.toggle("hidden", !opening);
        box.dataset.closing = "false";
        box.style.removeProperty("max-height");
        box.style.removeProperty("opacity");
        box.style.removeProperty("transform");
        return;
      }

      box.dataset.closing = String(!opening);
      box.style.overflow = "hidden";
      if (opening) {
        if (box.classList.contains("hidden")) {
          box.classList.remove("hidden");
          box.style.maxHeight = "0px";
          box.style.opacity = "0";
          box.style.transform = "translateY(-6px) scale(.99)";
        }
        requestAnimationFrame(() => {
          if (token !== adaptationToggleToken) return;
          box.style.maxHeight = `${box.scrollHeight + 8}px`;
          box.style.opacity = "1";
          box.style.transform = "none";
        });
      } else {
        box.style.maxHeight = `${box.getBoundingClientRect().height}px`;
        requestAnimationFrame(() => {
          if (token !== adaptationToggleToken) return;
          box.style.maxHeight = "0px";
          box.style.opacity = "0";
          box.style.transform = "translateY(-6px) scale(.99)";
        });
      }

      box.addEventListener("transitionend", event => {
        if (event.propertyName !== "max-height" || token !== adaptationToggleToken) return;
        if (!opening) box.classList.add("hidden");
        box.style.removeProperty("max-height");
        box.style.removeProperty("opacity");
        box.style.removeProperty("transform");
        box.style.removeProperty("overflow");
        box._motionController?.abort();
      }, { once: false, signal: (() => {
        box._motionController?.abort();
        box._motionController = new AbortController();
        return box._motionController.signal;
      })() });
    }

    /* =========================================================
       PRESS / RELEASE PHYSICS
    ========================================================= */

    let tactileListenersInstalled = false;
    let pressedControl = null;

    function installTactileListeners() {
      if (tactileListenersInstalled) return;
      tactileListenersInstalled = true;

      const clearPress = () => {
        pressedControl?.removeAttribute("data-pressed");
        pressedControl = null;
      };

      document.addEventListener("pointerdown", event => {
        if (event.button !== 0 || !(event.target instanceof Element)) return;
        const control = event.target.closest("button, [role='button']");
        if (!control || control.disabled) return;
        clearPress();
        pressedControl = control;
        control.setAttribute("data-pressed", "");
      }, { passive: true });

      document.addEventListener("pointerup", clearPress, { passive: true });
      document.addEventListener("pointercancel", clearPress, { passive: true });
      document.addEventListener("pointerleave", event => {
        if (event.target === pressedControl) clearPress();
      }, true);

      document.addEventListener("keydown", event => {
        if (event.repeat || !["Enter", " "].includes(event.key)) return;
        if (!(event.target instanceof Element)) return;
        const control = event.target.closest("button, [role='button']");
        if (!control || control.disabled) return;
        clearPress();
        pressedControl = control;
        control.setAttribute("data-pressed", "");
      });
      document.addEventListener("keyup", clearPress);
      window.addEventListener("blur", clearPress);
    }

    /* =========================================================
       ROUTER
    ========================================================= */

    function routeFromHash() {
      const hash =
        location.hash.replace("#", "");

      if (!hash || hash === "home") {
        state.view = "home";
        return;
      }

      if (hash === "branches") {
        state.view = "branches";
        return;
      }

      if (hash === "mine") {
        state.view = "mine";
        return;
      }

      if (hash === "grow") {
        state.view = "grow";
        return;
      }

      if (hash.startsWith("box/")) {
        const [, boxId] = hash.split("/");
        state.view = "question-box";
        state.boxId = boxId;
        state.ownerToken = null;
        return;
      }

      if (hash.startsWith("manage/")) {
        const [, boxId, ownerToken] = hash.split("/");
        state.view = "question-box-management";
        state.boxId = boxId;
        state.ownerToken = ownerToken;
        return;
      }

      if (hash.startsWith("branch/")) {
        const slug = hash.split("/")[1];

        state.view = "branch";
        state.currentSlug = slug;
        return;
      }

      state.view = "home";
    }

    window.addEventListener(
      "hashchange",
      () => {
        const previousView = state.view;
        const previousSlug = state.currentSlug;
        routeFromHash();
        if (previousView === "branch" &&
            (state.view !== "branch" || state.currentSlug !== previousSlug)) {
          branchRunController?.abort();
        }
        const opening = previousView === "branches" && state.view === "branch";
        const closing = previousView === "branch" && state.view === "branches";
        const source = opening
          ? app.querySelector(`.branch-node[data-slug="${state.currentSlug}"]`)
          : closing ? app.querySelector(".detail-wrap > div:first-child") : null;
        let target = null;
        const marker = Symbol("branch-transition");

        if (source && motionAvailable()) {
          source._viewMotionMarker = marker;
          source.style.viewTransitionName = "branch-surface";
        }
        updateWithMotion(() => {
          render();
          window.scrollTo(0, 0);
        }, {
          kind: opening ? "branch-open" : closing ? "branch-close" : "page",
          focus: true,
          afterUpdate: () => {
            target = opening
              ? app.querySelector(".detail-wrap > div:first-child")
              : closing ? app.querySelector(`.branch-node[data-slug="${previousSlug}"]`) : null;
            if (target && motionAvailable()) {
              target._viewMotionMarker = marker;
              target.style.viewTransitionName = "branch-surface";
            }
          },
          onFinish: () => {
            for (const element of [source, target]) {
              if (element?._viewMotionMarker !== marker) continue;
              element.style.removeProperty("view-transition-name");
              delete element._viewMotionMarker;
            }
          }
        });
      }
    );

        branches: "monet-water-lilies.jpg",
        grow: "monet-cliff-walk.jpg",
        mine: "monet-parasol.jpg",
        "question-box": "monet-lily-pond.jpg",
        "question-box-management": "monet-lily-pond.jpg"
      };
      const artwork = state.view === "branch"
        ? MONET_ART_BY_BRANCH[state.currentSlug]
        : viewArt[state.view];
      document.body.dataset.view = state.view;
      document.body.style.setProperty(
        "--page-art",
        `url("assets/monet/${artwork || "monet-sunrise.png"}")`
      );

      if (state.view === "home") {
        app.innerHTML = homeView();
      }

      else if (state.view === "matching") {
        app.innerHTML = matchingView();
      }

      else if (state.view === "branches") {
        app.innerHTML = branchesView();
      }

      else if (state.view === "branch") {
        app.innerHTML =
          branchView(
            getBranch(state.currentSlug)
          );
      }

      else if (state.view === "grow") {
        app.innerHTML = growView();
      }

      else if (state.view === "mine") {
        app.innerHTML = mineView();
      }

      else if (state.view === "question-box") {
        app.innerHTML = questionBoxView();
        loadQuestionBox();
      }

      else if (state.view === "question-box-management") {
        app.innerHTML = managementView();
        loadQuestionBoxManagement();
      }

      installTactileListeners();
    }

    routeFromHash();
    render();

    /* Make handlers visible to inline HTML events */
    window.go = go;
    window.fillNeed = fillNeed;
    window.submitNeed = submitNeed;
    window.runBranch = runBranch;
    window.toggleSave = toggleSave;
    window.toggleAdaptation = toggleAdaptation;
    window.submitAdaptation = submitAdaptation;
    window.growSeed = growSeed;
    window.setMineTab = setMineTab;
    window.saveSettings = saveSettings;
    window.createQuestionBox = createQuestionBox;
    window.submitAnonymousQuestion = submitAnonymousQuestion;
    window.answerAnonymousQuestion = answerAnonymousQuestion;
    window.removeAnonymousQuestion = removeAnonymousQuestion;
    window.setQuestionBoxOpen = setQuestionBoxOpen;
    window.copyQuestionBoxLink = copyQuestionBoxLink;

  </script>

</body>
</html>
