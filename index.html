<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="枝间 BRANCHES — 看见你的需求，多小都值得被看见。"
  />
  <title>枝间 · BRANCHES</title>

  <style>
    /* =========================================================
       01. DESIGN TOKENS
       Minimal from afar.
       Intricate up close.
       Tactile when touched.
    ========================================================= */

    :root {
      --paper: #f6f0e5;
      --paper-soft: #fbf7ee;
      --paper-warm: #eee4d1;

      --ink: #34302c;
      --ink-soft: #696158;
      --ink-faint: #8d8479;

      --sage: #a9b7a1;
      --sage-soft: #dbe2d4;
      --blue: #aabec7;
      --blue-soft: #dbe4e6;
      --rose: #ceb0aa;
      --rose-soft: #ead9d4;
      --butter: #eadcaf;
      --pearl: #f6f1df;

      --line: rgba(70, 62, 52, 0.12);
      --line-strong: rgba(70, 62, 52, 0.2);

      --shadow-soft:
        0 14px 28px rgba(102, 87, 63, 0.08),
        0 4px 8px rgba(102, 87, 63, 0.07);

      --shadow-button:
        0 9px 15px rgba(114, 96, 65, 0.13),
        0 2px 4px rgba(89, 76, 55, 0.1),
        inset 0 1.5px 0 rgba(255,255,255,.88);

      --shadow-button-hover:
        0 13px 22px rgba(114, 96, 65, 0.14),
        0 4px 7px rgba(89, 76, 55, 0.1),
        inset 0 2px 0 rgba(255,255,255,.95);

      --shadow-inset:
        inset 0 3px 8px rgba(107, 91, 67, 0.11),
        inset 0 -1px 1px rgba(255,255,255,.8);

      --radius-s: 12px;
      --radius-m: 18px;
      --radius-l: 26px;
      --radius-xl: 34px;

      --ease: cubic-bezier(.22,.8,.32,1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(234,220,175,.42), transparent 30%),
        radial-gradient(circle at 85% 18%, rgba(170,190,199,.28), transparent 31%),
        radial-gradient(circle at 75% 82%, rgba(206,176,170,.25), transparent 32%),
        radial-gradient(circle at 22% 75%, rgba(169,183,161,.27), transparent 33%),
        linear-gradient(145deg, #f7f1e6 0%, #f2eadb 45%, #f8f2e8 100%);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
      overflow-x: hidden;
    }

    /* Canvas grain.
       Nearly invisible from afar,
       discoverable up close. */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      z-index: 1000;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");

      mix-blend-mode: multiply;
    }

    body::after {
      content: "";
      position: fixed;
      width: 42vw;
      height: 42vw;
      left: -15vw;
      top: 34vh;
      background:
        radial-gradient(circle, rgba(255,248,215,.34), transparent 68%);
      pointer-events: none;
      filter: blur(34px);
      z-index: -1;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       02. TYPOGRAPHY
    ========================================================= */

    .editorial {
      font-family:
        "Iowan Old Style",
        "Songti SC",
        "STSong",
        Georgia,
        serif;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .17em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 14px;
    }

    .small-en {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      line-height: 1.4;
      letter-spacing: .055em;
      color: var(--ink-faint);
      font-weight: 450;
    }

    .muted {
      color: var(--ink-soft);
    }

    /* =========================================================
       03. APP SHELL
    ========================================================= */

    #app {
      min-height: 100vh;
    }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;

      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);

      background:
        linear-gradient(
          to bottom,
          rgba(248,243,233,.90),
          rgba(248,243,233,.64)
        );

      border-bottom: 1px solid rgba(77,67,55,.07);
    }

    .nav-inner {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .brand-cn {
      font-family:
        "Iowan Old Style",
        "Songti SC",
        serif;
      font-size: 20px;
      letter-spacing: .08em;
    }

    .brand-en {
      display: block;
      margin-top: 1px;
      font-size: 8px;
      letter-spacing: .21em;
      color: var(--ink-faint);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 9px 13px;
      border-radius: 12px;
      color: var(--ink-soft);
      font-size: 13px;
      transition: .2s var(--ease);
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--ink);
      background: rgba(255,255,255,.27);
    }

    main {
      min-height: calc(100vh - 76px);
    }

    /* =========================================================
       04. TACTILE PHYSICS
    ========================================================= */

    .tactile {
      position: relative;
      isolation: isolate;

      border: 1px solid rgba(103,90,69,.11);
      border-radius: 15px;

      background:
        radial-gradient(
          circle at 28% 14%,
          rgba(255,255,255,.95),
          transparent 42%
        ),
        linear-gradient(
          145deg,
          #fbf6e9,
          #efe5cf
        );

      box-shadow: var(--shadow-button);

      transform: translateY(0);
      cursor: pointer;

      transition:
        transform .13s var(--ease),
        box-shadow .16s var(--ease),
        filter .16s var(--ease);
    }

    .tactile:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-button-hover);
      filter: brightness(1.012);
    }

    .tactile:active,
    .tactile.is-pressed {
      transform: translateY(2px);

      box-shadow:
        0 1px 2px rgba(96,82,59,.08),
        inset 0 3px 6px rgba(101,85,62,.14),
        inset 0 -1px 2px rgba(255,255,255,.64);

      filter: brightness(.99);
    }

    .tactile::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;

      background:
        linear-gradient(
          160deg,
          rgba(255,255,255,.32),
          transparent 35%
        );

      opacity: .72;
      mix-blend-mode: screen;
      z-index: -1;
    }

    .release-glow::after {
      content: "";
      position: absolute;
      inset: -9px;
      border-radius: inherit;
      z-index: -2;
      pointer-events: none;

      border: 1px solid rgba(239,214,153,.38);

      animation: releaseGlow .48s ease-out forwards;
    }

    @keyframes releaseGlow {
      0% {
        opacity: .7;
        transform: scale(.96);
      }

      100% {
        opacity: 0;
        transform: scale(1.08);
      }
    }

    .btn {
      min-height: 48px;
      padding: 12px 19px;
      border-radius: 15px;
      font-weight: 620;
      letter-spacing: .01em;
    }

    .btn-primary {
      min-height: 52px;
      padding-inline: 22px;
    }

    .btn-secondary {
      min-height: 42px;
      padding: 9px 14px;
      font-size: 13px;

      box-shadow:
        0 5px 10px rgba(99,86,64,.08),
        0 1px 2px rgba(99,86,64,.08),
        inset 0 1px 0 rgba(255,255,255,.78);
    }

    .text-action {
      border: 0;
      background: none;
      padding: 0;

      color: var(--ink-soft);
      cursor: pointer;

      text-decoration-line: underline;
      text-decoration-color: rgba(69,61,53,.25);
      text-underline-offset: 5px;

      transition:
        color .18s ease,
        transform .18s ease;
    }

    .text-action:hover {
      color: var(--ink);
      transform: translateX(2px);
    }

    /* Input receives */

    .inset-field {
      width: 100%;
      border: 1px solid rgba(97,81,62,.09);
      outline: none;

      background:
        linear-gradient(
          145deg,
          rgba(238,229,211,.65),
          rgba(250,246,237,.74)
        );

      box-shadow: var(--shadow-inset);

      transition:
        box-shadow .2s ease,
        background .2s ease;
    }

    .inset-field:focus {
      background:
        linear-gradient(
          145deg,
          rgba(251,247,235,.9),
          rgba(241,233,214,.62)
        );

      box-shadow:
        inset 0 2px 6px rgba(103,87,64,.08),
        inset 0 0 24px rgba(255,250,228,.56),
        0 0 0 3px rgba(230,213,167,.13);
    }

    /* =========================================================
       05. HOME
    ========================================================= */

    .home {
      position: relative;
      min-height: calc(100vh - 76px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 72px 0 84px;
    }

    .home-inner {
      position: relative;
      width: min(820px, 100%);
      text-align: center;
      z-index: 5;
    }

    .home-mark {
      margin-bottom: 25px;
      color: var(--ink-faint);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .hero-title {
      max-width: 720px;
      margin: 0 auto 18px;

      font-family:
        "Iowan Old Style",
        "Songti SC",
        "STSong",
        Georgia,
        serif;

      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.08;
      letter-spacing: -.035em;
      font-weight: 500;
    }

    .hero-description {
      max-width: 550px;
      margin: 0 auto 35px;

      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.85;
    }

    .need-box {
      position: relative;
      width: min(690px, 100%);
      margin: auto;

      border-radius: 27px;
      padding: 8px;

      background:
        linear-gradient(
          135deg,
          rgba(239,230,211,.62),
          rgba(252,248,239,.72)
        );

      box-shadow:
        inset 0 4px 13px rgba(95,79,57,.11),
        inset 0 -2px 3px rgba(255,255,255,.85),
        0 20px 48px rgba(110,91,62,.055);
    }

    .need-input {
      display: block;
      width: 100%;
      min-height: 132px;

      border: 0;
      outline: 0;

      resize: none;

      padding:
        24px
        24px
        66px;

      border-radius: 21px;

      background:
        rgba(248,244,235,.42);

      color: var(--ink);
      line-height: 1.7;
      font-size: 16px;
    }

    .need-input::placeholder {
      color: rgba(70,62,54,.38);
    }

    .need-submit {
      position: absolute;
      right: 17px;
      bottom: 17px;
    }

    .need-submit .small-en {
      display: inline;
      margin-left: 6px;
    }

    .floating-needs {
      width: min(850px, 100%);
      margin: 27px auto 0;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 12px;
    }

    .need-chip {
      border: 1px solid rgba(79,69,58,.09);
      background: rgba(251,247,238,.45);
      color: var(--ink-soft);

      padding: 9px 12px;
      border-radius: 999px;

      cursor: pointer;
      font-size: 12px;

      backdrop-filter: blur(8px);

      transition:
        transform .3s var(--ease),
        background .3s ease,
        box-shadow .3s ease;
    }

    .need-chip:hover {
      transform: translateY(-2px);
      background: rgba(255,251,242,.67);
      box-shadow: 0 8px 18px rgba(100,84,61,.06);
    }

    .need-chip:nth-child(2n) {
      animation: driftA 8s ease-in-out infinite alternate;
    }

    .need-chip:nth-child(2n+1) {
      animation: driftB 10s ease-in-out infinite alternate;
    }

    @keyframes driftA {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    @keyframes driftB {
      from { transform: translateY(1px); }
      to { transform: translateY(-2px); }
    }

    .home-footnote {
      margin-top: 23px;
      font-size: 11px;
      color: var(--ink-faint);
    }

    /* =========================================================
       06. PAGE
    ========================================================= */

    .page {
      padding: 72px 0 100px;
      animation: pageIn .36s ease both;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;

      margin-bottom: 48px;
    }

    .page-head h1 {
      margin-bottom: 9px;
      font-size: clamp(36px, 5vw, 57px);
      line-height: 1.04;
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .page-head p {
      max-width: 560px;
      margin-bottom: 0;
      color: var(--ink-soft);
      line-height: 1.8;
      font-size: 14px;
    }

    /* =========================================================
       07. BRANCH CONSTELLATION / GALLERY
    ========================================================= */

    .branch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .branch-node {
      position: relative;
      min-height: 235px;
      overflow: hidden;

      padding: 25px;

      border: 1px solid rgba(76,66,54,.08);
      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(251,247,239,.48),
          rgba(243,235,220,.35)
        );

      cursor: pointer;

      transition:
        transform .32s var(--ease),
        box-shadow .32s var(--ease),
        background .32s ease;
    }

    .branch-node::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      right: -40px;
      bottom: -50px;
      border-radius: 50%;

      background: var(--wash, rgba(234,220,175,.27));
      filter: blur(24px);
      opacity: .6;
    }

    .branch-node:hover {
      transform: translateY(-5px);

      box-shadow:
        0 18px 35px rgba(105,88,61,.07),
        inset 0 1px 0 rgba(255,255,255,.54);

      background:
        linear-gradient(
          145deg,
          rgba(255,251,243,.64),
          rgba(243,235,220,.38)
        );
    }

    .branch-node:active {
      transform: translateY(-1px);

      box-shadow:
        0 5px 12px rgba(105,88,61,.05),
        inset 0 2px 5px rgba(99,83,60,.07);
    }

    .branch-kind {
      display: inline-flex;
      margin-bottom: 30px;
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .branch-name {
      position: relative;
      z-index: 2;

      max-width: 300px;

      font-family:
        "Iowan Old Style",
        "Songti SC",
        Georgia,
        serif;

      font-size: 25px;
      line-height: 1.14;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .branch-problem {
      position: relative;
      z-index: 2;

      margin: 0;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .branch-arrow {
      position: absolute;
      right: 22px;
      top: 22px;

      font-size: 18px;
      color: var(--ink-faint);

      transition: transform .3s var(--ease);
    }

    .branch-node:hover .branch-arrow {
      transform: translate(3px,-2px);
    }

    /* =========================================================
       08. MATCHING
    ========================================================= */

    .matching {
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      padding: 50px 0;
    }

    .matching-card {
      width: min(620px, 100%);
      text-align: center;
    }

    .matching-orbit {
      width: 120px;
      height: 120px;
      margin: 0 auto 28px;
      position: relative;
    }

    .matching-orbit::before,
    .matching-orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .matching-orbit::before {
      inset: 25px;
      background: rgba(233,218,171,.5);
      box-shadow:
        0 0 40px rgba(233,218,171,.35);
    }

    .matching-orbit::after {
      inset: 6px;
      border: 1px solid rgba(88,77,61,.12);
      animation: quietRotate 2.6s linear infinite;
      border-top-color: rgba(88,77,61,.44);
    }

    @keyframes quietRotate {
      to { transform: rotate(360deg); }
    }

    /* =========================================================
       09. BRANCH DETAIL
    ========================================================= */

    .detail-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 56px;
      align-items: start;
    }

    .back {
      margin-bottom: 35px;
    }

    .detail-kind {
      margin-bottom: 18px;
    }

    .detail-title {
      max-width: 690px;
      margin-bottom: 20px;

      font-family:
        "Iowan Old Style",
        "Songti SC",
        Georgia,
        serif;

      font-size: clamp(42px, 6vw, 70px);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 500;
    }

    .detail-problem {
      max-width: 620px;
      margin-bottom: 37px;

      font-size: 17px;
      color: var(--ink-soft);
      line-height: 1.85;
    }

    .source-note {
      display: inline-flex;
      gap: 8px;
      align-items: center;

      padding: 8px 10px;
      margin-bottom: 34px;

      border-bottom: 1px solid rgba(78,67,55,.12);

      font-size: 11px;
      color: var(--ink-faint);
    }

    .use-panel {
      position: sticky;
      top: 105px;

      padding: 25px;
      border-radius: 25px;

      border: 1px solid rgba(78,67,55,.08);

      background:
        linear-gradient(
          145deg,
          rgba(247,241,228,.59),
          rgba(253,249,240,.5)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.47),
        0 18px 44px rgba(102,86,62,.05);
    }

    .panel-label {
      margin-bottom: 18px;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .field {
      width: 100%;
      min-height: 44px;
      padding: 11px 13px;
      border-radius: 12px;
      color: var(--ink);
    }

    textarea.field {
      min-height: 92px;
      resize: vertical;
      line-height: 1.6;
    }

    .use-actions {
      display: grid;
      gap: 10px;
      margin-top: 23px;
    }

    .use-actions .btn {
      width: 100%;
    }

    .detail-section {
      border-top: 1px solid var(--line);
      padding-top: 29px;
      margin-top: 38px;
    }

    .detail-section h3 {
      margin-bottom: 13px;
      font-size: 15px;
      font-weight: 650;
    }

    .detail-section p {
      color: var(--ink-soft);
      line-height: 1.8;
      font-size: 13px;
    }

    .mock-output {
      margin-top: 20px;

      padding: 25px;

      border-radius: 18px;

      border: 1px solid rgba(79,68,55,.09);

      background:
        linear-gradient(
          145deg,
          rgba(252,249,241,.65),
          rgba(241,233,218,.45)
        );

      animation: outputIn .4s var(--ease);
    }

    @keyframes outputIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .output-title {
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .output-body {
      color: var(--ink);
      line-height: 1.8;
      font-size: 14px;
    }

    .output-body ul {
      padding-left: 19px;
    }

    .output-body li {
      margin-bottom: 8px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(81,70,57,.11);
    }

    .check-row input {
      accent-color: #8f9c83;
    }

    .adaptation {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    /* =========================================================
       10. GROW
    ========================================================= */

    .grow {
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      padding: 70px 0;
    }

    .grow-card {
      width: min(620px, 100%);
      text-align: center;
    }

    .seed {
      width: 64px;
      height: 64px;
      margin: 0 auto 27px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 37% 28%,
          #fff9e8,
          #e6d9ae 58%,
          #caba8c
        );

      box-shadow:
        0 12px 28px rgba(115,96,62,.15),
        inset 0 2px 2px rgba(255,255,255,.7);
    }

    .grow-title {
      margin-bottom: 13px;
      font-family:
        "Iowan Old Style",
        "Songti SC",
        serif;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .grow-copy {
      max-width: 520px;
      margin: 0 auto 28px;
      color: var(--ink-soft);
      line-height: 1.8;
      font-size: 14px;
    }

    .grow-need {
      margin: 0 auto 28px;
      padding: 18px 20px;
      max-width: 520px;

      border-radius: 16px;

      background: rgba(248,243,233,.52);
      border: 1px solid rgba(80,69,55,.08);

      color: var(--ink);
      font-family:
        "Iowan Old Style",
        "Songti SC",
        serif;
      font-size: 18px;
    }

    /* =========================================================
       11. MINE
    ========================================================= */

    .mine-grid {
      display: grid;
      grid-template-columns: 190px minmax(0,1fr);
      gap: 40px;
      align-items: start;
    }

    .mine-tabs {
      position: sticky;
      top: 105px;

      display: grid;
      gap: 5px;
    }

    .mine-tab {
      text-align: left;
      border: 0;
      background: transparent;

      padding: 11px 12px;

      border-radius: 11px;

      cursor: pointer;
      color: var(--ink-soft);

      transition: .2s ease;
    }

    .mine-tab:hover,
    .mine-tab.active {
      color: var(--ink);
      background: rgba(255,255,255,.32);
    }

    .mine-content {
      min-width: 0;
    }

    .saved-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }

    .saved-item {
      padding: 20px;
      border-radius: 17px;

      border: 1px solid rgba(78,67,54,.08);

      background: rgba(250,246,237,.4);
    }

    .saved-item h3 {
      margin-bottom: 9px;
      font-size: 17px;
    }

    .saved-item p {
      margin-bottom: 14px;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.6;
    }

    .empty-state {
      padding: 55px 20px;
      text-align: center;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      color: var(--ink-soft);
    }

    .record {
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }

    .record-time {
      margin-top: 7px;
      font-size: 10px;
      color: var(--ink-faint);
    }

    .settings-card {
      max-width: 640px;
      padding: 25px 0;
      border-top: 1px solid var(--line);
    }

    .settings-note {
      margin-top: 16px;
      color: var(--ink-faint);
      font-size: 11px;
      line-height: 1.7;
    }

    /* =========================================================
       12. TOAST
    ========================================================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 27px;
      z-index: 10000;

      transform: translate(-50%, 20px);

      padding: 12px 17px;
      border-radius: 15px;

      color: var(--ink);

      background:
        linear-gradient(
          145deg,
          rgba(253,249,238,.96),
          rgba(238,227,205,.95)
        );

      border: 1px solid rgba(77,65,51,.09);

      box-shadow:
        0 14px 32px rgba(89,74,52,.13),
        inset 0 1px rgba(255,255,255,.8);

      opacity: 0;
      pointer-events: none;

      transition:
        opacity .25s ease,
        transform .25s var(--ease);

      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       13. MOBILE
    ========================================================= */

    @media (max-width: 880px) {
      .branch-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .detail-wrap {
        grid-template-columns: 1fr;
      }

      .use-panel {
        position: static;
      }

      .mine-grid {
        grid-template-columns: 1fr;
      }

      .mine-tabs {
        position: static;
        display: flex;
        overflow-x: auto;
        padding-bottom: 7px;
      }

      .mine-tab {
        white-space: nowrap;
      }
    }

    @media (max-width: 620px) {
      .navbar {
        height: 68px;
      }

      .nav-inner {
        width: min(100% - 24px, 1180px);
      }

      .brand-cn {
        font-size: 17px;
      }

      .nav-link {
        padding: 8px 7px;
        font-size: 11px;
      }

      .nav-link .desktop-en {
        display: none;
      }

      .shell {
        width: calc(100% - 28px);
      }

      .home {
        min-height: calc(100vh - 68px);
        padding: 52px 0 72px;
      }

      .hero-title {
        font-size: 43px;
      }

      .hero-description {
        font-size: 14px;
      }

      .need-input {
        min-height: 155px;
        font-size: 15px;
      }

      .need-submit {
        left: 16px;
        right: 16px;
      }

      .need-submit .btn {
        width: 100%;
      }

      .branch-grid {
        grid-template-columns: 1fr;
      }

      .branch-node {
        min-height: 205px;
      }

      .page {
        padding-top: 45px;
      }

      .page-head {
        display: block;
      }

      .detail-title {
        font-size: 45px;
      }

      .saved-grid {
        grid-template-columns: 1fr;
      }

      .floating-needs {
        justify-content: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>

  <script>
    /* =========================================================
       BRANCHES MVP
       No framework.
       No install.
       localStorage persistence.
    ========================================================= */

    const STORAGE = {
      saved: "branches.saved",
      seeds: "branches.seeds",
      adaptations: "branches.adaptations",
      memories: "branches.memories",
      settings: "branches.settings"
    };

    const branches = [
      {
        slug: "teach-me-like-this",
        type: "Knowledge Branch",
        typeZh: "知识枝",
        name: "Teach Me Like This",
        problem: "我有一篇必须读、但完全看不进去的论文。",
        keywords: [
          "论文", "文章", "阅读", "看不懂", "理解",
          "解释", "学习", "paper", "文献", "知识"
        ],
        color: "rgba(170,190,199,.34)"
      },

      {
        slug: "training-branch",
        type: "Persona Branch",
        typeZh: "人格枝",
        name: "XXX’s Training Branch",
        problem: "我信任一个健身博主，但今天状态特殊，想按 TA 的判断体系得到建议。",
        keywords: [
          "健身", "训练", "运动", "酸痛", "睡眠",
          "器械", "减脂", "增肌", "身体", "周期"
        ],
        color: "rgba(169,183,161,.35)"
      },

      {
        slug: "less-ai-more-me",
        type: "Skill Branch",
        typeZh: "能力枝",
        name: "Less AI. More Me.",
        problem: "AI 写完东西，但充满 AI 味。",
        keywords: [
          "ai味", "ai 味", "不像人", "润色", "改写",
          "自然", "文案", "写作", "口吻", "机械"
        ],
        color: "rgba(206,176,170,.36)"
      },

      {
        slug: "morning-trend-radar",
        type: "Workflow Branch",
        typeZh: "工作流枝",
        name: "Morning Trend Radar",
        problem: "团队每天要人工追踪行业热点。",
        keywords: [
          "热点", "趋势", "行业", "追踪", "监测",
          "推送", "每天", "新闻", "信息", "团队"
        ],
        color: "rgba(234,220,175,.43)"
      },

      {
        slug: "what-do-i-need-today",
        type: "App Branch",
        typeZh: "应用枝",
        name: "What Do I Need Today?",
        problem: "每次出门都担心忘东西。",
        keywords: [
          "出门", "行李", "忘东西", "旅行", "会议",
          "清单", "带什么", "收拾", "准备", "check"
        ],
        color: "rgba(174,194,182,.34)"
      },

      {
        slug: "friends-anon-question-box",
        type: "Link Branch",
        typeZh: "链接枝",
        name: "Friends’ Anonymous Question Box",
        problem: "朋友之间想玩匿名提问、夸夸、爆料或整活，但普通问卷太正经。",
        keywords: [
          "匿名", "提问箱", "朋友", "群聊", "真心话",
          "爆料", "夸夸", "整活", "问卷", "匿名提问"
        ],
        color: "rgba(201,177,200,.29)"
      }
    ];

    const floatingNeeds = [
      "这篇论文我真的看不进去",
      "AI 写得太像 AI 了",
      "今天到底该不该训练？",
      "每天追热点好累",
      "出门总觉得忘了什么",
      "想和朋友玩匿名提问",
      "有没有更适合我的版本？"
    ];

    const state = {
      view: "home",
      currentSlug: null,
      lastNeed: "",
      mineTab: "saved"
    };

    const app = document.querySelector("#app");
    const toast = document.querySelector("#toast");

    /* =========================================================
       STORAGE
    ========================================================= */

    function read(key, fallback = []) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function write(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function settings() {
      return {
        model: "deepseek-v4-flash",
        apiBase: "",
        apiKey: "",
        ...read(STORAGE.settings, {})
      };
    }

    /* =========================================================
       UTILITIES
    ========================================================= */

    function escapeHTML(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function nowLabel() {
      return new Date().toLocaleString("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function getBranch(slug) {
      return branches.find(branch => branch.slug === slug);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2300);
    }

    function go(view, slug = null) {
      state.view = view;
      state.currentSlug = slug;

      if (view === "branch" && slug) {
        location.hash = `branch/${slug}`;
      } else {
        location.hash = view;
      }

      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* =========================================================
       NAVBAR
    ========================================================= */

    function navbar() {
      const active =
        state.view === "branch" ? "branches" : state.view;

      return `
        <header class="navbar">
          <div class="nav-inner">

            <button
              class="brand"
              onclick="go('home')"
              aria-label="回到枝间首页"
            >
              <span class="brand-cn">枝间</span>
              <span class="brand-en">BRANCHES</span>
            </button>

            <nav class="nav-links">
              <button
                class="nav-link ${active === "home" ? "active" : ""}"
                onclick="go('home')"
              >
                首页
              </button>

              <button
                class="nav-link ${active === "branches" ? "active" : ""}"
                onclick="go('branches')"
              >
                BRANCHES
              </button>

              <button
                class="nav-link ${active === "mine" ? "active" : ""}"
                onclick="go('mine')"
              >
                我的枝间
              </button>
            </nav>

          </div>
        </header>
      `;
    }

    /* =========================================================
       HOME
    ========================================================= */

    function homeView() {
      return `
        ${navbar()}

        <main class="home">
          <div class="shell">

            <section class="home-inner">

              <div class="home-mark">
                ZHIJIAN · BRANCHES
              </div>

              <h1 class="hero-title">
                看见你的需求，<br>
                多小都值得被看见。
              </h1>

              <p class="hero-description">
                说说最近哪里有一点不顺。
                枝间会理解你的需求，并带你找到已经生长出来、
                可以直接使用的 Branch。
                <span class="small-en">
                  Tell us what feels slightly off.
                  Find something already grown for it.
                </span>
              </p>

              <form
                class="need-box"
                onsubmit="submitNeed(event)"
              >
                <textarea
                  id="needInput"
                  class="need-input"
                  maxlength="500"
                  placeholder="最近，有什么小事让你觉得不太顺？"
                  aria-label="描述你的需求"
                ></textarea>

                <div class="need-submit">
                  <button class="btn btn-primary tactile" type="submit">
                    说说看 →
                    <span class="small-en">
                      Find my Branch
                    </span>
                  </button>
                </div>
              </form>

              <div class="floating-needs">
                ${floatingNeeds.map(text => `
                  <button
                    class="need-chip"
                    onclick="fillNeed('${escapeHTML(text)}')"
                  >
                    ${escapeHTML(text)}
                  </button>
                `).join("")}
              </div>

              <div class="home-footnote">
                不需要懂 AI，也不需要先知道自己需要什么工具。
                <span class="small-en">
                  No installation. No registration. Start with the need.
                </span>
              </div>

            </section>

          </div>
        </main>
      `;
    }

    function fillNeed(text) {
      const input = document.querySelector("#needInput");
      input.value = text;
      input.focus();
    }

    /* =========================================================
       MATCH
    ========================================================= */

    function matchNeed(text) {
      const normalized = text.toLowerCase();

      let best = null;
      let bestScore = 0;

      branches.forEach(branch => {
        let score = 0;

        branch.keywords.forEach(keyword => {
          if (normalized.includes(keyword.toLowerCase())) {
            score += keyword.length >= 3 ? 2 : 1;
          }
        });

        if (score > bestScore) {
          best = branch;
          bestScore = score;
        }
      });

      return bestScore >= 2 ? best : null;
    }

    function rememberNeed(text) {
      const memories = read(STORAGE.memories);

      memories.unshift({
        text,
        time: nowLabel()
      });

      write(
        STORAGE.memories,
        memories.slice(0, 30)
      );
    }

    function submitNeed(event) {
      event.preventDefault();

      const input = document.querySelector("#needInput");
      const need = input.value.trim();

      if (!need) {
        showToast("先说说发生了什么。");
        input.focus();
        return;
      }

      state.lastNeed = need;
      rememberNeed(need);

      state.view = "matching";
      render();

      const branch = matchNeed(need);

      setTimeout(() => {
        if (branch) {
          go("branch", branch.slug);
        } else {
          state.view = "grow";
          location.hash = "grow";
          render();
        }
      }, 720);
    }

    function matchingView() {
      return `
        ${navbar()}

        <main class="matching">
          <div class="shell">

            <section class="matching-card">

              <div class="matching-orbit"></div>

              <div class="eyebrow">
                正在寻找与你最靠近的 Branch
              </div>

              <h1 class="editorial">
                先理解需求，<br>
                再找东西。
              </h1>

              <p class="muted">
                “${escapeHTML(state.lastNeed)}”
              </p>

              <span class="small-en">
                Understanding the need before choosing the interface.
              </span>

            </section>

          </div>
        </main>
      `;
    }

    /* =========================================================
       BRANCHES
    ========================================================= */

    function branchesView() {
      return `
        ${navbar()}

        <main class="page">
          <div class="shell">

            <div class="page-head">

              <div>
                <div class="eyebrow">
                  BRANCHES
                </div>

                <h1 class="editorial">
                  已经长出来的东西。
                </h1>

                <p>
                  Branch 可以是一套知识、一个人的判断体系、
                  一项能力、一条工作流、一个小应用，
                  或者一个可以直接打开的链接。
                  <span class="small-en">
                    Different forms. Same principle:
                    born from a real need.
                  </span>
                </p>
              </div>

            </div>

            <section class="branch-grid">

              ${branches.map(branch => `
                <article
                  class="branch-node"
                  style="--wash:${branch.color}"
                  onclick="go('branch','${branch.slug}')"
                >

                  <span class="branch-arrow">↗</span>

                  <div class="branch-kind">
                    ${branch.typeZh} · ${branch.type}
                  </div>

                  <h2 class="branch-name">
                    ${escapeHTML(branch.name)}
                  </h2>

                  <p class="branch-problem">
                    ${escapeHTML(branch.problem)}
                  </p>

                </article>
              `).join("")}

            </section>

          </div>
        </main>
      `;
    }

    /* =========================================================
       BRANCH INPUT FORMS
    ========================================================= */

    function branchForm(branch) {
      switch (branch.slug) {

        case "teach-me-like-this":
          return `
            <div class="field-group">
              <label class="field-label">
                粘贴你看不进去的内容
              </label>

              <textarea
                name="content"
                class="field inset-field"
                placeholder="把论文片段粘贴到这里……"
              ></textarea>
            </div>

            <div class="field-group">
              <label class="field-label">
                你想怎么理解它？
              </label>

              <select
                name="style"
                class="field inset-field"
              >
                <option>温迪口吻 + RPG 世界地图</option>
                <option>朋友聊天式解释</option>
                <option>考试重点模式</option>
                <option>比喻优先模式</option>
              </select>
            </div>
          `;

        case "training-branch":
          return `
            ${simpleInput("sleep", "昨晚睡了多久？", "例如：6.5 小时")}
            ${simpleInput("soreness", "现在酸痛程度", "例如：腿 6/10")}
            ${simpleInput("time", "今天可用时间", "例如：35 分钟")}
            ${simpleInput("equipment", "今天有什么器械？", "例如：哑铃 + 瑜伽垫")}
          `;

        case "less-ai-more-me":
          return `
            <div class="field-group">
              <label class="field-label">
                粘贴需要去掉 AI 味的文字
              </label>

              <textarea
                name="text"
                class="field inset-field"
                placeholder="把那段有点像机器写的文字放进来……"
              ></textarea>
            </div>
          `;

        case "morning-trend-radar":
          return `
            ${simpleInput("field", "关注什么领域？", "例如：AI Agent")}
            ${simpleInput("time", "什么时候推送？", "例如：每天 9:00")}
            ${simpleInput("destination", "推到哪里？", "例如：团队文档")}
          `;

        case "what-do-i-need-today":
          return `
            <div class="field-group">
              <label class="field-label">
                今天是什么场景？
              </label>

              <select
                name="scene"
                class="field inset-field"
              >
                <option>日常出门</option>
                <option>旅行</option>
                <option>开会 / 活动</option>
                <option>上课</option>
                <option>过夜</option>
              </select>
            </div>

            ${simpleInput("destination", "去哪儿？", "例如：学校")}
            ${simpleInput("activity", "会做什么？", "例如：上课 + 图书馆")}
          `;

        case "friends-anon-question-box":
          return `
            <div class="field-group">
              <label class="field-label">
                玩法
              </label>

              <select
                name="mode"
                class="field inset-field"
              >
                <option>真心话</option>
                <option>夸夸</option>
                <option>回忆杀</option>
                <option>整活</option>
              </select>
            </div>

            <div class="field-group">
              <label class="field-label">
                开放对象
              </label>

              <select
                name="audience"
                class="field inset-field"
              >
                <option>好友</option>
                <option>群聊</option>
                <option>二维码</option>
              </select>
            </div>

            ${simpleInput("code", "群暗号", "例如：今晚别装")}
          `;
      }
    }

    function simpleInput(name, label, placeholder) {
      return `
        <div class="field-group">

          <label class="field-label">
            ${label}
          </label>

          <input
            name="${name}"
            class="field inset-field"
            placeholder="${placeholder}"
          />

        </div>
      `;
    }

    /* =========================================================
       DETAIL
    ========================================================= */

    function branchView(branch) {
      if (!branch) {
        go("branches");
        return "";
      }

      const saved = read(STORAGE.saved);
      const isSaved = saved.includes(branch.slug);

      return `
        ${navbar()}

        <main class="page">
          <div class="shell">

            <button
              class="text-action back"
              onclick="go('branches')"
            >
              ← 回到所有 Branch
            </button>

            <section class="detail-wrap">

              <div>

                <div class="detail-kind eyebrow">
                  ${branch.typeZh} · ${branch.type}
                </div>

                <h1 class="detail-title">
                  ${escapeHTML(branch.name)}
                </h1>

                <p class="detail-problem">
                  ${escapeHTML(branch.problem)}
                </p>

                <div class="source-note">
                  从一个真实的小麻烦开始。
                  <span class="small-en">
                    Grown from a real need.
                  </span>
                </div>

                <section class="detail-section">

                  <h3>
                    它会做什么？
                  </h3>

                  <p>
                    ${branchDescription(branch.slug)}
                  </p>

                </section>

                <section
                  id="mockOutput"
                  class="detail-section hidden"
                >
                </section>

              </div>

              <aside class="use-panel">

                <div class="panel-label">
                  试着使用这个 Branch
                </div>

                <form
                  id="branchForm"
                  onsubmit="runBranch(event,'${branch.slug}')"
                >

                  ${branchForm(branch)}

                  <div class="use-actions">

                    <button
                      type="submit"
                      class="btn btn-primary tactile"
                    >
                      用用看 →
                      <span class="small-en">
                        Use this Branch
                      </span>
                    </button>

                    <button
                      type="button"
                      class="btn btn-secondary tactile"
                      onclick="toggleSave('${branch.slug}')"
                    >
                      ${isSaved ? "已保存 ✓" : "保存到我的枝间"}
                    </button>

                  </div>

                </form>

                <div class="adaptation">

                  <button
                    class="text-action"
                    onclick="toggleAdaptation()"
                  >
                    好像还差一点
                  </button>

                  <span class="small-en">
                    Request adaptation
                  </span>

                  <div
                    id="adaptationBox"
                    class="hidden"
                    style="margin-top:18px;"
                  >

                    <textarea
                      id="adaptationText"
                      class="field inset-field"
                      placeholder="哪里不太适合你？"
                    ></textarea>

                    <button
                      class="btn btn-primary tactile"
                      style="width:100%;margin-top:10px;"
                      onclick="submitAdaptation('${branch.slug}')"
                    >
                      交给 Personalware
                      <span class="small-en">
                        Request adaptation
                      </span>
                    </button>

                  </div>

                </div>

              </aside>

            </section>

          </div>
        </main>
      `;
    }

    function branchDescription(slug) {
      const descriptions = {
        "teach-me-like-this":
          "把“读懂”从唯一方式变成很多种方式。你可以选择角色口吻、世界观、比喻方式或考试模式，同时保留真正重要的英文原文。",

        "training-branch":
          "把一个创作者公开表达过的训练理念整理成可调用的判断体系，再结合你今天的状态给出建议。示例结果不构成医疗建议。",

        "less-ai-more-me":
          "不是简单删掉几个 AI 常用词，而是重新调整节奏、句式、信息密度和表达习惯，让文字重新像一个具体的人。",

        "morning-trend-radar":
          "把重复的信息追踪变成固定流程：抓取、去重、分类、摘要、形成文档，再送到团队真正工作的地方。",

        "what-do-i-need-today":
          "不从一份永远不变的万能清单开始，而从今天的场景开始。旅行、上课、开会和普通出门，可以得到完全不同的 Belonging Check。",

        "friends-anon-question-box":
          "生成一个朋友限定的匿名入口。朋友免登录进入，获得随机匿名身份，再提交问题；箱主可以审核、回答并把回答卡重新发回群里。"
      };

      return descriptions[slug];
    }

    /* =========================================================
       RUN MOCK
    ========================================================= */

    function runBranch(event, slug) {
      event.preventDefault();

      const form = event.currentTarget;
      const values = Object.fromEntries(new FormData(form).entries());

      const output = document.querySelector("#mockOutput");

      output.classList.remove("hidden");

      output.innerHTML = `
        <div class="mock-output">

          <div class="output-title">
            MOCK RESULT
          </div>

          <div class="output-body">
            ${mockResult(slug, values)}
          </div>

        </div>
      `;

      output.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function mockResult(slug, data) {

      if (slug === "teach-me-like-this") {
        return `
          <strong>🗺️ 世界地图已经展开。</strong>

          <p>
            先把这篇论文想象成一张 RPG 地图。
            作者并不是一次告诉你所有答案，
            而是在地图上放了几个必须经过的区域。
          </p>

          <p>
            <strong>主城：</strong>
            论文真正想解决的问题。
          </p>

          <p>
            <strong>支线任务：</strong>
            不同理论、案例与研究方法。
          </p>

          <p>
            <strong>最终 Boss：</strong>
            作者需要证明自己的解释比其他解释更成立。
          </p>

          <p>
            你选择的理解方式：
            <strong>${escapeHTML(data.style || "温迪口吻 + RPG 世界地图")}</strong>
          </p>

          <p>
            关键英文概念将保留原文，
            中文负责解释关系，而不是替换原概念。
          </p>
        `;
      }

      if (slug === "training-branch") {
        return `
          <strong>今天不追求“完成训练”，先判断值不值得练。</strong>

          <p>
            睡眠：${escapeHTML(data.sleep || "未填写")}<br>
            酸痛：${escapeHTML(data.soreness || "未填写")}<br>
            可用时间：${escapeHTML(data.time || "未填写")}
          </p>

          <p>
            Mock 建议：今天可以把训练目标改成
            <strong>恢复 + 维持习惯</strong>，
            缩短训练时间、降低动作数量，
            不追 PR。
          </p>

          <small>
            此结果仅用于演示 Branch 形式，
            不构成医疗或健康诊断建议。
          </small>
        `;
      }

      if (slug === "less-ai-more-me") {
        const original = data.text || "我们应该充分认识到这一问题的重要性，并积极采取措施进行改善。";

        return `
          <p>
            <strong>原句：</strong><br>
            ${escapeHTML(original)}
          </p>

          <p>
            <strong>Less AI. More Me.：</strong><br>
            这件事其实没必要说得那么大。
            问题已经摆在这里了，
            下一步是看看我们到底能改什么。
          </p>

          <p>
            调整重点：减少总结腔、对称句式和空泛判断，
            保留真正有信息的部分。
          </p>
        `;
      }

      if (slug === "morning-trend-radar") {
        return `
          <p>
            <strong>${escapeHTML(data.field || "AI Agent")} · 今日 Radar</strong>
          </p>

          <p>
            07:00 抓取来源<br>
            ↓<br>
            去重 128 → 41 条<br>
            ↓<br>
            分类为 产品 / 技术 / 公司 / 研究<br>
            ↓<br>
            提取 8 条值得关注内容<br>
            ↓<br>
            生成《Morning Trend Radar》<br>
            ↓<br>
            ${escapeHTML(data.time || "09:00")}
            推送至
            ${escapeHTML(data.destination || "团队文档")}
          </p>
        `;
      }

      if (slug === "what-do-i-need-today") {
        return `
          <strong>
            ${escapeHTML(data.scene || "日常出门")} · Belonging Check
          </strong>

          <div style="margin-top:13px">

            ${checkItem("手机")}
            ${checkItem("钥匙")}
            ${checkItem("耳机")}
            ${checkItem("充电宝")}
            ${checkItem("水")}
            ${checkItem("今天会用到的证件 / 门禁")}
            ${checkItem("和活动有关的特殊物品")}

          </div>

          <p style="margin-top:15px">
            去往：
            ${escapeHTML(data.destination || "今天的目的地")}。
            清单会根据天气、停留时间和活动继续变化。
          </p>
        `;
      }

      if (slug === "friends-anon-question-box") {
        const id = Math.random().toString(36).slice(2, 7);

        return `
          <p>
            <strong>匿名提问箱已创建。</strong>
          </p>

          <p>
            https://anon.box/f/${id}
          </p>

          <p>
            创建房间 →
            生成链接 / 二维码 →
            朋友免登录进入 →
            随机匿名昵称 →
            提交问题 →
            箱主审核 / 回答 →
            生成回答卡回群
          </p>

          <p>
            🕵️ 匿名朋友问：
            “如果必须和群里一个人交换人生三天，你选谁？”
          </p>

          <p>
            箱主答：……<br>
            围观群众可贴表情。
          </p>

          <small>
            可随时关闭链接 · 不收集手机号 ·
            禁止骚扰与人肉。
          </small>
        `;
      }
    }

    function checkItem(text) {
      return `
        <label class="check-row">
          <input type="checkbox">
          <span>${text}</span>
        </label>
      `;
    }

    /* =========================================================
       SAVE
    ========================================================= */

    function toggleSave(slug) {
      let saved = read(STORAGE.saved);

      if (saved.includes(slug)) {
        saved = saved.filter(item => item !== slug);
        showToast("已经从我的枝间移除。");
      } else {
        saved.unshift(slug);
        showToast("已经长进你的枝间。");
      }

      write(STORAGE.saved, saved);
      render();
    }

    /* =========================================================
       ADAPTATION
    ========================================================= */

    function toggleAdaptation() {
      document
        .querySelector("#adaptationBox")
        ?.classList
        .toggle("hidden");
    }

    function submitAdaptation(slug) {
      const text =
        document.querySelector("#adaptationText")
          ?.value
          .trim();

      if (!text) {
        showToast("告诉我们哪里还差一点。");
        return;
      }

      const adaptations =
        read(STORAGE.adaptations);

      adaptations.unshift({
        slug,
        text,
        status: "已转交 Personalware",
        time: nowLabel()
      });

      write(
        STORAGE.adaptations,
        adaptations
      );

      document.querySelector(
        "#adaptationBox"
      ).innerHTML = `
        <div class="mock-output">
          <strong>已经转交 Personalware。</strong>
          <p style="margin-top:8px;margin-bottom:0">
            这个请求不会修改原 Branch。
            它会作为一次新的定制需求被记录。
          </p>
        </div>
      `;

      showToast("Request adaptation 已记录。");
    }

    /* =========================================================
       GROW
    ========================================================= */

    function growView() {
      return `
        ${navbar()}

        <main class="grow">
          <div class="shell">

            <section class="grow-card">

              <div class="seed"></div>

              <div class="eyebrow">
                NO MATCH YET
              </div>

              <h1 class="grow-title">
                那就让第一个长出来。
              </h1>

              <p class="grow-copy">
                目前还没有足够接近的 Branch。
                这不意味着你的需求太小，
                只是它还没有被收录。
                <span class="small-en">
                  No close match yet.
                  Your need can become a seed.
                </span>
              </p>

              <div class="grow-need">
                “${escapeHTML(state.lastNeed)}”
              </div>

              <button
                class="btn btn-primary tactile"
                onclick="growSeed()"
              >
                Grow the first one
                <span class="small-en">
                  把它变成一颗 seed
                </span>
              </button>

              <div style="margin-top:22px">
                <button
                  class="text-action"
                  onclick="go('home')"
                >
                  换一种说法
                </button>
              </div>

            </section>

          </div>
        </main>
      `;
    }

    function growSeed() {
      const seeds = read(STORAGE.seeds);

      seeds.unshift({
        need: state.lastNeed,
        status: "Seed",
        time: nowLabel()
      });

      write(STORAGE.seeds, seeds);

      showToast("已经种下一颗 Seed。");

      state.mineTab = "seeds";

      setTimeout(() => {
        go("mine");
      }, 500);
    }

    /* =========================================================
       MY BRANCHES
    ========================================================= */

    function mineView() {
      return `
        ${navbar()}

        <main class="page">
          <div class="shell">

            <div class="page-head">

              <div>

                <div class="eyebrow">
                  MY BRANCHES
                </div>

                <h1 class="editorial">
                  我的枝间。
                </h1>

                <p>
                  这里保存与你有关的 Branch、还没有长成的 Seed、
                  定制请求和你曾经说过的需求。
                </p>

              </div>

            </div>

            <section class="mine-grid">

              <nav class="mine-tabs">

                ${mineTabButton("saved", "保存的 Branch")}
                ${mineTabButton("seeds", "Seeds")}
                ${mineTabButton("adaptations", "Personalware")}
                ${mineTabButton("memory", "记忆")}
                ${mineTabButton("settings", "设置")}
                ${mineTabButton("account", "账号")}

              </nav>

              <div class="mine-content">
                ${mineTabContent()}
              </div>

            </section>

          </div>
        </main>
      `;
    }

    function mineTabButton(id, label) {
      return `
        <button
          class="mine-tab ${state.mineTab === id ? "active" : ""}"
          onclick="setMineTab('${id}')"
        >
          ${label}
        </button>
      `;
    }

    function setMineTab(tab) {
      state.mineTab = tab;
      render();
    }

    function mineTabContent() {

      if (state.mineTab === "saved") {
        const saved = read(STORAGE.saved);

        if (!saved.length) {
          return empty(
            "这里还没有 Branch。",
            "找到喜欢的 Branch 后，可以把它保存到这里。"
          );
        }

        return `
          <div class="saved-grid">

            ${saved.map(slug => {
              const branch = getBranch(slug);

              if (!branch) return "";

              return `
                <article class="saved-item">

                  <div class="eyebrow">
                    ${branch.typeZh}
                  </div>

                  <h3 class="editorial">
                    ${escapeHTML(branch.name)}
                  </h3>

                  <p>
                    ${escapeHTML(branch.problem)}
                  </p>

                  <button
                    class="text-action"
                    onclick="go('branch','${branch.slug}')"
                  >
                    打开 Branch →
                  </button>

                </article>
              `;
            }).join("")}

          </div>
        `;
      }

      if (state.mineTab === "seeds") {
        const seeds = read(STORAGE.seeds);

        if (!seeds.length) {
          return empty(
            "还没有 Seed。",
            "当没有 Branch 能回答你的需求时，可以种下第一个。"
          );
        }

        return seeds.map(seed => `
          <div class="record">

            <strong>
              ${escapeHTML(seed.need)}
            </strong>

            <div class="record-time">
              ${escapeHTML(seed.status)}
              ·
              ${escapeHTML(seed.time)}
            </div>

          </div>
        `).join("");
      }

      if (state.mineTab === "adaptations") {
        const adaptations =
          read(STORAGE.adaptations);

        if (!adaptations.length) {
          return empty(
            "还没有定制请求。",
            "如果一个 Branch 很接近、但还不够适合你，可以交给 Personalware。"
          );
        }

        return adaptations.map(item => {
          const branch = getBranch(item.slug);

          return `
            <div class="record">

              <strong>
                ${escapeHTML(
                  branch?.name || item.slug
                )}
              </strong>

              <p class="muted">
                ${escapeHTML(item.text)}
              </p>

              <div class="record-time">
                ${escapeHTML(item.status)}
                ·
                ${escapeHTML(item.time)}
              </div>

            </div>
          `;
        }).join("");
      }

      if (state.mineTab === "memory") {
        const memories =
          read(STORAGE.memories);

        if (!memories.length) {
          return empty(
            "枝间还不认识你。",
            "你说过的需求会留在这台设备上，帮助之后的匹配更贴近你。"
          );
        }

        return `
          <p class="muted" style="line-height:1.8">
            MVP 阶段，记忆只保存在你的浏览器 localStorage 中。
            不上传服务器。
          </p>

          ${memories.map(item => `
            <div class="record">

              ${escapeHTML(item.text)}

              <div class="record-time">
                ${escapeHTML(item.time)}
              </div>

            </div>
          `).join("")}
        `;
      }

      if (state.mineTab === "settings") {
        const s = settings();

        return `
          <div class="settings-card">

            <div class="field-group">

              <label class="field-label">
                默认匹配模型
              </label>

              <select
                id="settingModel"
                class="field inset-field"
              >
                <option
                  value="deepseek-v4-flash"
                  ${s.model === "deepseek-v4-flash" ? "selected" : ""}
                >
                  deepseek-v4-flash
                </option>

                <option
                  value="local-demo"
                  ${s.model === "local-demo" ? "selected" : ""}
                >
                  Local Demo Matcher
                </option>
              </select>

            </div>

            <div class="field-group">

              <label class="field-label">
                API Proxy 地址
              </label>

              <input
                id="settingApiBase"
                class="field inset-field"
                value="${escapeHTML(s.apiBase || "")}"
                placeholder="例如：https://your-domain.com/api/match"
              />

            </div>

            <div class="field-group">

              <label class="field-label">
                API Key
              </label>

              <input
                id="settingApiKey"
                type="password"
                class="field inset-field"
                value="${escapeHTML(s.apiKey || "")}"
                placeholder="MVP 可留空"
              />

            </div>

            <button
              class="btn btn-primary tactile"
              onclick="saveSettings()"
            >
              保存设置
            </button>

            <p class="settings-note">
              当前 MVP 为了做到 0 安装、直接打开即可使用，
              默认采用浏览器本地匹配逻辑。
              正式上线时不要把平台官方 API Key 写进前端；
              应由服务端或 Serverless Proxy 保管密钥。
            </p>

          </div>
        `;
      }

      if (state.mineTab === "account") {
        return `
          <div class="settings-card">

            <div class="eyebrow">
              OPTIONAL ACCOUNT
            </div>

            <h2 class="editorial">
              不登录，也可以使用枝间。
            </h2>

            <p class="muted" style="line-height:1.8">
              账号只用于未来跨设备同步。
              当前 MVP 的收藏、Seed、记忆和定制请求，
              都保存在当前浏览器。
            </p>

            <button
              class="btn btn-secondary tactile"
              onclick="showToast('MVP 暂不要求注册。')"
            >
              登录 / 创建账号
              <span class="small-en">
                Optional
              </span>
            </button>

          </div>
        `;
      }
    }

    function empty(title, text) {
      return `
        <div class="empty-state">

          <strong>${title}</strong>

          <p style="margin-top:9px;margin-bottom:0">
            ${text}
          </p>

        </div>
      `;
    }

    function saveSettings() {
      const next = {
        model:
          document.querySelector("#settingModel").value,

        apiBase:
          document.querySelector("#settingApiBase").value.trim(),

        apiKey:
          document.querySelector("#settingApiKey").value.trim()
      };

      write(STORAGE.settings, next);

      showToast("设置已保存在这台设备上。");
    }

    /* =========================================================
       PRESS / RELEASE PHYSICS
    ========================================================= */

    function installTactileListeners() {

      document
        .querySelectorAll(".tactile")
        .forEach(button => {

          button.addEventListener(
            "pointerdown",
            () => {
              button.classList.add("is-pressed");
            }
          );

          const release = () => {
            button.classList.remove("is-pressed");
            button.classList.remove("release-glow");

            void button.offsetWidth;

            button.classList.add("release-glow");

            setTimeout(() => {
              button.classList.remove("release-glow");
            }, 500);
          };

          button.addEventListener(
            "pointerup",
            release
          );

          button.addEventListener(
            "pointerleave",
            () => {
              button.classList.remove("is-pressed");
            }
          );

          button.addEventListener(
            "pointercancel",
            () => {
              button.classList.remove("is-pressed");
            }
          );
        });
    }

    /* =========================================================
       ROUTER
    ========================================================= */

    function routeFromHash() {
      const hash =
        location.hash.replace("#", "");

      if (!hash || hash === "home") {
        state.view = "home";
        return;
      }

      if (hash === "branches") {
        state.view = "branches";
        return;
      }

      if (hash === "mine") {
        state.view = "mine";
        return;
      }

      if (hash === "grow") {
        state.view = "grow";
        return;
      }

      if (hash.startsWith("branch/")) {
        const slug = hash.split("/")[1];

        state.view = "branch";
        state.currentSlug = slug;
        return;
      }

      state.view = "home";
    }

    window.addEventListener(
      "hashchange",
      () => {
        routeFromHash();
        render();
      }
    );

    /* =========================================================
       RENDER
    ========================================================= */

    function render() {

      if (state.view === "home") {
        app.innerHTML = homeView();
      }

      else if (state.view === "matching") {
        app.innerHTML = matchingView();
      }

      else if (state.view === "branches") {
        app.innerHTML = branchesView();
      }

      else if (state.view === "branch") {
        app.innerHTML =
          branchView(
            getBranch(state.currentSlug)
          );
      }

      else if (state.view === "grow") {
        app.innerHTML = growView();
      }

      else if (state.view === "mine") {
        app.innerHTML = mineView();
      }

      installTactileListeners();
    }

    routeFromHash();
    render();

    /* Make handlers visible to inline HTML events */
    window.go = go;
    window.fillNeed = fillNeed;
    window.submitNeed = submitNeed;
    window.runBranch = runBranch;
    window.toggleSave = toggleSave;
    window.toggleAdaptation = toggleAdaptation;
    window.submitAdaptation = submitAdaptation;
    window.growSeed = growSeed;
    window.setMineTab = setMineTab;
    window.saveSettings = saveSettings;

  </script>
</body>
</html>
